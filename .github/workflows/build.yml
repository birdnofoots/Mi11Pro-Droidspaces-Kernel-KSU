name: Build mars kernel (Droidspaces)

# 说明
# ────
# 目标设备: Xiaomi Mi 11 Pro (mars / mars_eea), Android 13, MIUI V14.0.7.0.TKAEUXM
# 目标内核: 5.4.233-qgki-gbb70cde46897, 原厂用 AOSP clang 11.0.2 (build 6877366) + LLD 构建
#
# 本工作流在 GitHub runner 上编译,产物是裸 Image。
# 打包成可 fastboot 的 boot.img 由仓库里的 tools/splice-bootimg.py 在本地完成
# (逐字节拼接原厂 boot.img,保留头部 32 字节原厂签名字段与原厂压缩 ramdisk)。
#
# 变体(variant):
#   control          原厂 .config 原样 + 上游源码不改动 —— 用来判断「源码/工具链本身能不能开机」
#   allbuiltin       全部驱动内建 + Droidspaces 需求项
#   allbuiltin-nolto 同上,但关掉 CONFIG_LTO_CLANG(排除 LTO 变量)
#   allbuiltin-ksu   同上 + 内置 KernelSU
#   droidspaces      驱动仍为模块 + Droidspaces 需求项(旧基线,仅作对照)

on:
  workflow_dispatch:
    inputs:
      variants:
        description: '要构建的变体(逗号分隔),留空=默认四个'
        required: false
        default: 'allbuiltin,allbuiltin-nolto,control,allbuiltin-ksu'
      toolchain:
        description: '工具链'
        required: true
        type: choice
        default: 'aosp-clang-11'
        options:
          - aosp-clang-11     # 原厂同款: Android clang 11.0.2 r383902b1 (build 6877366)
          - system-clang      # runner 自带 clang-14(仅作对照)
      allowlist:
        description: '★ 白名单模块名(逗号分隔,留空=用补丁内的默认 5 项)。例:msm_drm,cnss2,wlan'
        required: false
        default: ''
      ksu_tag:
        description: 'KernelSU tag(仅 allbuiltin-ksu 变体使用)'
        required: false
        default: 'v0.7.6'
      upstream:
        description: '内核源码仓库(留空=默认 EcrosoftXiao 5.4.191)'
        required: false
        default: ''
      upstream_branch:
        description: '内核源码分支(留空=默认 twelve)'
        required: false
        default: ''
env:
  ARCH: arm64
  # runner 是 x86_64,目标是 aarch64 → 必须交叉编译
  CROSS_COMPILE: aarch64-linux-gnu-
  SUBLEVEL_OVERRIDE: '233'
  UPSTREAM: https://github.com/EcrosoftXiao/kernel_xiaomi_mars.git
  UPSTREAM_BRANCH: twelve

jobs:
  # ── 把 variants 输入展开成 matrix ────────────────────────────────
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        env:
          SEL: ${{ github.event.inputs.variants }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          all_variants = {
              "control":          {"defconfig": "vendor/mars_stock_defconfig",        "lto": "keep", "ksu": "0", "desc": "原厂配置对照(源码不改)"},
              "allbuiltin":       {"defconfig": "vendor/mars_allbuiltin_defconfig",   "lto": "keep", "ksu": "0", "desc": "全内建 + Droidspaces"},
              "allbuiltin-nolto": {"defconfig": "vendor/mars_allbuiltin_defconfig",   "lto": "none", "ksu": "0", "desc": "全内建 + Droidspaces,关 LTO"},
              "allbuiltin-ksu":   {"defconfig": "vendor/mars_allbuiltin_defconfig",   "lto": "keep", "ksu": "1", "desc": "全内建 + Droidspaces + KernelSU"},
              "allbuiltin-nokabi": {"defconfig": "vendor/mars_allbuiltin_defconfig",  "lto": "keep", "ksu": "0", "kabi": "0", "desc": "全内建但不打 kABI 补丁(二分用)"},
              "allbuiltin-nowlan": {"defconfig": "vendor/mars_allbuiltin_nowlan_defconfig", "lto": "keep", "ksu": "0", "desc": "全内建但 WLAN 栈退回模块"},
              "droidspaces":      {"defconfig": "vendor/mars_droidspaces_defconfig",  "lto": "keep", "ksu": "0", "desc": "模块式 + Droidspaces(旧基线)"},
              # ★ 最保守的候选:直接用「上游树自带的 mars_defconfig」,只翻 14 个
              #   Droidspaces 必需开关,其余一个字节都不动。之前的变体都是拿设备
              #   A13 的 /proc/config.gz 覆盖到 A12 树上(差异 75 项),很可能就是
              #   内核起不来的真正原因。
              "minimal":          {"defconfig": "vendor/mars_minimal_defconfig",      "lto": "keep", "ksu": "0", "kabi": "0", "desc": "树自带配置+仅 Droidspaces 开关,不打 kABI"},
              "minimal-kabi":     {"defconfig": "vendor/mars_minimal_defconfig",      "lto": "keep", "ksu": "0", "kabi": "1", "desc": "同上 + kABI 补丁(让原厂模块也能加载)"},
              "minimal-nolto":    {"defconfig": "vendor/mars_minimal_defconfig",      "lto": "none", "ksu": "0", "kabi": "0", "desc": "同上但关 LTO(排查 LTO 变量)"},
              # ── 定位问题用(2026-09-29)────────────────────────────
              # 已经证明:bootloader 接受改过的镜像(改 1 字节的原厂镜像能正常启动)、
              # AVB 是 orange/unlocked、格式/头部/命令行/UFS 时钟 pinctrl 都与原厂一致。
              # 所以是我们内核本身挂了。下面三个用来把范围缩到最小:
              "tree0":            {"defconfig": "vendor/mars_tree0_defconfig",        "lto": "keep", "ksu": "0", "kabi": "0", "desc": "上游树自带配置【零改动】—— 判断这棵树能否启动"},
              # ★★ 最有希望的一个:换用「QGKI 的 mars 树」(5.4.242,与设备的
              #    5.4.233-qgki 只差 9 个版本),配置直接用设备原厂完整配置 + 14 个开关。
              #    之前一直用非 QGKI 的 5.4.191 A12 树配一台 QGKI 设备,这是根本性错配。
              "qgki":             {"defconfig": "vendor/mars_qgki_ds_defconfig",      "lto": "keep", "ksu": "0", "kabi": "0", "desc": "QGKI mars 树(5.4.242)+ 原厂配置 + Droidspaces 开关"},
              "qgki-fbcon":       {"defconfig": "vendor/mars_qgki_fbcon_defconfig", "lto": "keep", "ksu": "0", "kabi": "0", "desc": "同上 + 屏幕内核日志(panic 停机不重启,便于拍照)"},
              # ★ 看门狗:这棵树的 drivers/soc/qcom/Kconfig 用 `range 11000 11000`
              #   把 bark 锁死在 11 秒、pet 锁死在 9.36 秒;原厂是 20 秒 / 15 秒。
              #   设备"启动到一半约 10 秒后重启"正好对上 11 秒咬。下面两个变体对齐原厂 / 彻底放宽。
              "qgki-wd20":        {"defconfig": "vendor/mars_qgki_ds_defconfig",      "lto": "keep", "ksu": "0", "kabi": "0", "desc": "qgki + 看门狗对齐原厂(bark 20s / pet 15s)"},
              "qgki-wd60":        {"defconfig": "vendor/mars_qgki_wd60_defconfig",   "lto": "keep", "ksu": "0", "kabi": "0", "desc": "qgki + 看门狗放宽到 bark 60s(诊断:确认是不是看门狗)"},
              # ★ 内核侧日志落盘:每 2 秒把 log_buf 写到 boot_b 偏移 128MB。
              #   不依赖 init / SELinux / 用户态 —— 硬复位前最后一次写入已在盘上。
              #   读回见 TAKEOVER.md 第 15 节。
              "qgki-logk":        {"defconfig": "vendor/mars_qgki_ds_defconfig",      "lto": "keep", "ksu": "0", "kabi": "0", "desc": "qgki + logdump(内核日志落到 boot_b 尾部)"},
              # ★★ 用小米官方 star/mars 树(hmhmdcy/Mi11Pro-Droidspaces-Kernel)+ 作者自己的
              #    Droidspaces 片段,走官方 QGKI 片段链构建(不是单个 defconfig)
              "star-ds":          {"defconfig": "(QGKI 片段链)",                      "lto": "keep", "ksu": "0", "kabi": "0", "desc": "官方 star 树 + QGKI 片段链 + star_droidspaces.config"},
              "star-ds-ksu":      {"defconfig": "(QGKI 片段链)",                      "lto": "keep", "ksu": "1", "kabi": "0", "desc": "同上 + 内建 KernelSU(刷完即 root)"},
              # ★★ 「原厂完整配置」路线:不用片段链,直接用 mars_qgki_ds_defconfig
              #    (原厂 /proc/config.gz 原样 + 12 个 Droidspaces 开关),
              #    并把 =m 的驱动选择性翻成 =y(触摸/充电/指纹/BT/NFC/SLIMBUS/MI_*)。
              #    动机:片段链缺这 62 项 ⇒ 自编内核上触摸/电池/WLAN 全废(见 §63)。
              "star-stock":       {"defconfig": "vendor/mars_qgki_ds_defconfig",    "directcfg": "1", "lto": "keep", "ksu": "0", "kabi": "0", "desc": "★ star 树 + 原厂完整配置 + =m 选择性内建 + 全部补丁"},
              # ★★ 2026-10-02 定案变体:原厂 config 原样【不做 =m→=y 翻转】+ 全部补丁。
              #    证据(sde59 logdump):star-stock 把 62 项翻成内建后,/vendor 里同名 .ko
              #    仍被 init 加载 ⇒ "Driver 'xxx' is already registered, aborting" ×N,
              #    最后 WLAN modprobe 卡死(uptime 129.3s 被 init 超时 SIGKILL)⇒ 系统停住
              #    ⇒ bootloader 判启动失败 ⇒ fastboot/回退原厂。
              #    ⇒ 正解:保持 =m,让 /vendor 的原厂 .ko 自己装(vermagic 已对齐)。
              "star-stock-raw":   {"defconfig": "vendor/mars_qgki_ds_defconfig",    "directcfg": "1", "noflip": "1", "lto": "keep", "ksu": "0", "kabi": "0", "desc": "★★ 原厂 config + 不翻内建(保持 =m)+ 全部补丁"},
              # ★★★ 2026-10-06 F24:【回到唯一有硬成功证据的线】。
              #   证据(§70,2026-10-02):star-stock(62 项 =m→=y 内建)能进 MIUI,
              #   35.5s boot_complete,**触摸/显示可用**,只差 Wi-Fi。
              #   它当年的死因有 logdump 出处(m2y.py KEEP 注释):
              #     /vendor 同名 .ko 仍被 modprobe ⇒ "already registered" ×N
              #     ⇒ WLAN 栈卡死(uptime 129.3s,init SIGKILL 'exec 24 modprobe … qca_cld3_wlan')
              #     ⇒ 系统停住 ⇒ bootloader 判失败。
              #   ⇒ 本轮的【唯一改动】= 用内核内黑名单(按 mod->name)拒绝 WLAN/CNSS 栈,
              #     让那次 modprobe 立刻失败而不是卡死。
              "star-stock":       {"defconfig": "vendor/mars_qgki_ds_defconfig",    "directcfg": "1", "lto": "keep", "ksu": "0", "kabi": "0", "desc": "★ F24 L1 内建线 + WLAN/CNSS 黑名单 + 全部补丁(回到 §70 的成功架构)"},
              "star-stock-ksu":   {"defconfig": "vendor/mars_qgki_ds_defconfig",    "directcfg": "1", "lto": "keep", "ksu": "1", "kabi": "0", "desc": "★ F24 同上 + 内建 KernelSU(刷完即 root,便于自诊断/Droidspaces)"},
              # ★★★ 2026-10-06 F25:【H2' 单变量判别 —— 去掉 logdump】。
              #   证据(F24 真机 logdump,§22.14.K):5/5 次自编启动的死亡时刻都落在
              #   logdump 落盘之后 ~0.4s 内 —— 4.12s(4s 快照)/8.16s(8s)/11.36s(11s)/
              #   run162 12.37s(11s)/run163 4.20s(4s)。
              #   机制候选:logdump 读 printk 环形缓冲 + 自己 pr_* 输出 + 原始块设备写,
              #   一旦在持锁/持 logbuf_lock 期间阻塞 ⇒ PMIC 看门狗咬 ⇒ 静默硬复位。
              #   ⇒ 唯一改动 = 不接入 patches/logdump.c;其余与 F24 完全一致。
              #   代价:若它仍崩,就没有黑匣子了(本机 /sys/fs/pstore 实测为空,补不了)
              #        —— 但一旦它【能起来】,我们就有活体系统可诊断(KSU 版还直接有 root)。
              "star-stock-nolog":    {"defconfig": "vendor/mars_qgki_ds_defconfig", "directcfg": "1", "lto": "keep", "ksu": "0", "kabi": "0", "nologdump": "1", "desc": "★★ F25:同 F24 但【不接 logdump】(判 H2':是不是它把内核写死的)"},
              "star-stock-nolog-ksu":{"defconfig": "vendor/mars_qgki_ds_defconfig", "directcfg": "1", "lto": "keep", "ksu": "1", "kabi": "0", "nologdump": "1", "desc": "★★ F25 同上 + 内建 KernelSU(若起来就直接有 root 可活体诊断)"},
              # ★★★ 2026-10-06 F26:【恢复白名单】—— 本轮真凶定位后的正解。
              #   证据: 逐补丁 diff 10-04(能进 MIUI) vs 现在,唯一能解释"之后全是硬复位"的差异 =
              #     mod-blacklist.py 从【白名单(只放行 msm_drm 一个)】改成了【全放行 + 无条件 return 0】。
              #     全放行 = 把 ~100 个用【另一棵树】编译的原厂 .ko 强塞进内核 ⇒ 读错结构偏移 ⇒ 静默硬复位。
              #     (Droidspaces 官方指南逐字警告过这件事。)
              #   本变体 = 精选白名单(msm_drm + hwid + xiaomi_touch + fts_touch_spi_k2 +
              #     qti_battery_charger_main ⇒ 显示 + 触摸链 + 充电/USB),其余一律拒绝;
              #     WLAN/CNSS 栈故意不含(最复杂,留到稳定之后再单独加)。
              #   logdump 保留(这次它不再是嫌疑人,而是黑匣子)。
              "star-stock-wl":       {"defconfig": "vendor/mars_qgki_ds_defconfig", "directcfg": "1", "lto": "keep", "ksu": "0", "kabi": "0", "desc": "★★★ F26:精选白名单(显示+触摸链+充电)+ logdump,其余 vendor 模块一律拒"},
              "star-stock-wl-ksu":   {"defconfig": "vendor/mars_qgki_ds_defconfig", "directcfg": "1", "lto": "keep", "ksu": "1", "kabi": "0", "desc": "★★★ F26 同上 + 内建 KernelSU"},
              # ★★★ 2026-10-06 F30:【不翻转 + 精选白名单】—— "零尝试"之谜的解药。
              #   证据(F29 logdump + config 逐项 diff):
              #     · 114 个模块里只有 71 个被 init 尝试;没被尝试的 43 个里包含
              #       fts_touch_spi_k2 / qti_battery_charger_main / cnss2 / qca_cld3_wlan
              #       / qca_cld3_qca6390 + 一整批音频模块;
              #     · 我们内核把 15 个驱动翻成了【内建】(SLIMBUS / BTFM_SLIM / SLIMBUS_MSM_NGD
              #       / MSM_RDBG / MI_HARDWARE_ID / NFC_QTI_I2C / STMVL53L5 / IR_SPI / EDAC_QCOM
              #       / LEDS_* ...),名字与 vendor 模块【同名】⇒ 装载时在 check_modinfo 之前
              #       就因"已存在"静默失败(-EEXIST)⇒ 既无 mars-allow 也无 skip 行 ✓ 完美对上观测;
              #     · 另外 call_usermodehelper 在本内核上【完全不可用】(新旧写法都返回 255,
              #       5 次尝试全 255,且无 SELinux 记录) ⇒ "内核自己装模块"这条路已判死。
              #   ⇒ 本变体 = 【保持原厂 =m,不翻转】+ 同样的精选白名单 ⇒ 消除同名冲突,
              #     让 init 能真正把 msm_drm/hwid/xiaomi_touch/fts_touch_spi_k2/
              #     qti_battery_charger_main 装进来。
              "star-stock-wl-noflip":{"defconfig": "vendor/mars_qgki_ds_defconfig","directcfg": "1", "noflip": "1", "lto": "keep", "ksu": "0", "kabi": "0", "desc": "★★★ F30:不翻转(=m 原厂)+ 精选白名单 —— 解'内建同名冲突'导致的零尝试"},
              # ★★★ 2026-10-06 F21/run168【决定性对照实验】:纯原厂配置、零 Droidspaces 开关、
              #   连 kABI 补丁都不打(kabi=0)、MODVERSIONS 保持原厂 =y。
              #   目的:把「我们内核与原厂 ABI 的 33.77% 匹配率」这个数字归因 ——
              #     · 若本变体 CRC 匹配率仍 ~33% ⇒ 差异来自【树本身/工具链】,
              #       而不是我们的容器配置 ⇒ MIUI 路线在 ABI 上不可达 ⇒ 转 LOS。
              #     · 若本变体 CRC 匹配率 >99% ⇒ 是容器配置的代价 ⇒ 按官方 kABI 安全清单
              #       逐组回滚,直到收敛(每轮只需 35 分钟 CI,不必刷机)。
              "stock-pure":       {"defconfig": "vendor/mars_stock_pure_defconfig", "directcfg": "1", "noflip": "1", "lto": "keep", "ksu": "0", "kabi": "0", "nocore": "1", "desc": "★ 纯原厂配置对照(零容器开关/零 kABI 补丁/跳过全部要件断言)—— 判定 ABI 差异来自树还是配置"},
              # ★ 诊断:把 panic 时的内核日志写进 boot_a 分区,重启后可以 dd 读出来。
              #   配合 cmdline 里的 androidboot.init_fatal_panic=1,
              #   让 init 的致命失败变成内核 panic → pstore/blk 落盘。
              "qgki-pstore":      {"defconfig": "vendor/mars_qgki_pstore_defconfig", "lto": "keep", "ksu": "0", "kabi": "0", "desc": "qgki + 日志落到 boot_a(pstore/blk),用来抓崩溃原因"},
              "tree0-191":        {"defconfig": "vendor/mars_tree0_defconfig",        "lto": "keep", "ksu": "0", "kabi": "0", "sublevel": "191", "desc": "同上,但不谎报版本(真报 5.4.191)"},
              "nodevt":           {"defconfig": "vendor/mars_nodevt_defconfig",       "lto": "keep", "ksu": "0", "kabi": "0", "desc": "minimal 但关掉 DEVTMPFS(原厂也是关的)"},
              "fbcon":            {"defconfig": "vendor/mars_fbcon_defconfig",        "lto": "keep", "ksu": "0", "kabi": "0", "desc": "minimal + 屏幕内核日志(VT/fbcon/fbdev)"},
          }
          sel = (os.environ.get("SEL") or "").strip()
          names = [s.strip() for s in sel.split(",") if s.strip()] if sel else \
                  ["allbuiltin", "allbuiltin-nolto", "control", "allbuiltin-ksu"]
          bad = [n for n in names if n not in all_variants]
          if bad:
              raise SystemExit("unknown variant(s): %s" % bad)
          inc = []
          for n in names:
              v = dict(all_variants[n]); v["variant"] = n
              inc.append(v)
          print("matrix=" + json.dumps({"include": inc}))
          PY
          cat "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.variant }}
    env:
      DEBIAN_FRONTEND: noninteractive
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ccache bison flex libssl-dev libelf-dev bc python3 \
            python-is-python3 gperf device-tree-compiler libncurses-dev \
            rsync unzip ca-certificates lz4 xz-utils cpio zip time \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # ── 工具链 ──────────────────────────────────────────────────
      - name: 安装原厂同款 clang 11.0.2 (r383902b1)
        if: github.event.inputs.toolchain != 'system-clang'
        run: |
          set -uo pipefail
          DEST="$HOME/aosp-clang"
          rm -rf "$DEST"; mkdir -p "$DEST"
          ok=0
          # 1) GitHub 镜像优先(manifest_6877366 = 原厂 CC_VERSION_TEXT 里的 build 号)
          for r in credits-infra/clang-r383902b1 ruoqing501/clang-r383902b1 qssn70/clang-r383902b1; do
            U="https://codeload.github.com/${r}/tar.gz/refs/heads/main"
            echo "=== 尝试镜像 $U"
            if curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/clang.tgz "$U"; then
              rm -rf /tmp/clangx && mkdir -p /tmp/clangx && tar -xzf /tmp/clang.tgz -C /tmp/clangx
              SRC=$(find /tmp/clangx -maxdepth 1 -mindepth 1 -type d | head -1)
              if [ -x "$SRC/bin/clang" ]; then cp -a "$SRC"/. "$DEST"/; ok=1; break; fi
            fi
          done
          # 2) Google 官方 prebuilt
          if [ "$ok" != 1 ]; then
            for d in clang-r383902b1 clang-r383902b; do
              U="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/${d}.tar.gz"
              echo "=== 尝试 $U"
              if curl -fsSL --retry 2 --connect-timeout 20 -o /tmp/clang.tgz "$U"; then
                rm -rf "$DEST"/*; tar -xzf /tmp/clang.tgz -C "$DEST" && ok=1 && break
              fi
            done
          fi
          # 3) apt 兜底
          if [ "$ok" != 1 ]; then
            echo "::warning::AOSP prebuilt 全部失败,退回 apt clang-11"
            sudo apt-get install -y --no-install-recommends clang-11 lld-11 || true
            if command -v clang-11 >/dev/null; then
              mkdir -p "$DEST/bin"
              for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
                base=${t%-11}; [ -e "/usr/bin/${t}-11" ] && ln -sf "/usr/bin/${t}-11" "$DEST/bin/$base"
              done
              [ -e /usr/bin/ld.lld-11 ] && ln -sf /usr/bin/ld.lld-11 "$DEST/bin/ld.lld"
              ok=1
            fi
          fi
          [ "$ok" = 1 ] || { echo "::error::找不到 clang 11"; exit 1; }
          if [ ! -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi
          echo "$DEST/bin" >> $GITHUB_PATH
          "$DEST/bin/clang" --version || true
          cat "$DEST/AndroidVersion.txt" 2>/dev/null || true

      - name: 选择工具链
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.toolchain }}" = "system-clang" ]; then
            echo "CC=clang"       >> $GITHUB_ENV
            echo "LD=ld.lld"      >> $GITHUB_ENV
          else
            echo "CC=clang"       >> $GITHUB_ENV
            echo "LD=ld.lld"      >> $GITHUB_ENV
          fi
          which clang; clang --version | head -2
          which ld.lld; ld.lld --version | head -1

      - name: ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.variant }}-${{ github.event.inputs.toolchain }}-${{ hashFiles('configs/**') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.variant }}-${{ github.event.inputs.toolchain }}-${{ hashFiles('configs/**') }}-
            ccache-${{ matrix.variant }}-${{ github.event.inputs.toolchain }}-

      - name: 配置 ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G"        >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1"        >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime" >> $GITHUB_ENV

      # ── 源码 ───────────────────────────────────────────────────
      - name: 拉取上游内核源码
        env:
          UP_IN: ${{ github.event.inputs.upstream }}
          BR_IN: ${{ github.event.inputs.upstream_branch }}
        run: |
          UP="${UP_IN:-$UPSTREAM}"
          BR="${BR_IN:-$UPSTREAM_BRANCH}"
          echo "上游仓库: $UP  分支: $BR"
          git clone --depth=1 -b "$BR" "$UP" kernel
          cd kernel
          echo "UPSTREAM_USED=$UP@$BR" >> $GITHUB_ENV
          echo "KERNEL_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          # 每个变体可以覆盖 SUBLEVEL。默认全仓库是 233(把 5.4.191 的源码
          # 谎报成 5.4.233,为了 pin 住 vermagic);但高通驱动里有很多
          # LINUX_VERSION_CODE 分支,谎报版本可能让它走错代码路径。
          # 所以留一个「老老实实报 191」的变体做对照。
          if [ -n "${{ matrix.sublevel }}" ]; then
            echo "SUBLEVEL_OVERRIDE=${{ matrix.sublevel }}" >> $GITHUB_ENV
            echo "本变体 SUBLEVEL 覆盖为 ${{ matrix.sublevel }}"
          fi
          : > .scmversion          # 抑制 git 后缀,保证 vermagic 精确可控
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile

      # ── Droidspaces kABI 补丁(control 变体不打)──────────────────
      - name: 应用 Droidspaces kABI 补丁
        continue-on-error: true
        if: matrix.variant != 'control' && matrix.kabi != '0'
        run: |
          cd kernel
          cp -r ../patches .
          patch -p1 -F5 --no-backup-if-mismatch \
            < patches/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch || true
          patch -p1 -F5 --no-backup-if-mismatch \
            < patches/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch || true
          rm -f patches/*.rej include/linux/sched/*.rej
          python3 - <<'PY'
          p='include/linux/sched/user.h'
          s=open(p).read()
          if 'ANDROID_KABI_USE(1, unsigned long mq_bytes)' not in s:
              old="""\t/* Miscellaneous per-user rate limit */
          \tstruct ratelimit_state ratelimit;

          \tANDROID_KABI_RESERVE(1);
          \tANDROID_KABI_RESERVE(2);
          };"""
              new="""\t/* Miscellaneous per-user rate limit */
          \tstruct ratelimit_state ratelimit;

          #if defined(CONFIG_POSIX_MQUEUE)
          \tANDROID_KABI_USE(1, unsigned long mq_bytes);
          \tANDROID_KABI_RESERVE(2);
          #else
          \tANDROID_KABI_RESERVE(1);
          \tANDROID_KABI_RESERVE(2);
          #endif
          };"""
              if old in s:
                  open(p,'w').write(s.replace(old,new,1)); print('user.h 手工修复完成')
              else:
                  print('WARN: user.h 未匹配手工修复模板'); raise SystemExit(1)
          else:
              print('user.h 已含 kABI 修复')
          PY
          echo "--- 校验 ---"
          grep -c 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem)' include/linux/sched.h
          grep -c 'ANDROID_KABI_USE(1, unsigned long mq_bytes)' include/linux/sched/user.h

      # 之前漏编的对象 msm_fb.o/msm_gem.o 嵌在 techpack 的
      # "msm_drm-$(CONFIG_DRM_MSM) +=" 列表里,而我们没开 CONFIG_DRM_MSM →
      # 整个 msm_drm 不编 → 链接失败。
      # 直接用 sed 在 repo 上替换 Makefile,改为无条件编译。
      # ── 修 fbcon 链接错误:排除上游 msm_fbdev.o ──────────────
      # 原因:drivers/gpu/drm/msm/Makefile 里
      #   msm-$(CONFIG_DRM_FBDEV_EMULATION) += msm_fbdev.o
      # 这一行不受 CONFIG_DRM_MSM 约束;而我们的显示由 techpack 提供,
      # CONFIG_DRM_MSM 未开 ⇒ msm.o(含 msm_gem.o/msm_fb.o)整体没编,
      # 但 msm_fbdev.o 被编了 ⇒ 链接时一堆 undefined symbol。
      # 去掉它,保留 CONFIG_DRM_FBDEV_EMULATION=y 让 techpack 的 fbdev 生效。
      # ── 补齐残缺树缺失的源文件 ────────────────────────────────
      # hmhmdcy/Mi11Pro-Droidspaces-Kernel 的 .gitignore 里有 `vmlinux*`,
      # 作者 git add 时误伤了两个"以 vmlinux 开头"的源文件:
      #   arch/arm64/kernel/vmlinux.lds.S
      #   include/asm-generic/vmlinux.lds.h
      # 少它们 → 编译报 "No rule to make target .../vmlinux.lds"
      # 从另一棵完整的 5.4 树拉过来补上。
      - name: 补齐残缺树缺失的源文件
        continue-on-error: true
        run: |
          cd kernel
          # ★ 来源必须是【同一血统】:hmhmdcy 的树就是导入自
          #   MiCode/Xiaomi_Kernel_OpenSource 的 star-r-oss 分支
          #   (Makefile 同为 5.4.61、大小 64802 字节,完全一致)
          #   之前我从第三方 A14 树(liubutnotliu@fourteen)取 → 混树 ✗
          # 已知受害者(逐个补是打地鼠,现在改成整包镜像):
          #   arch/arm64/kernel/vmlinux.lds.S
          #   include/asm-generic/vmlinux.lds.h
          #   techpack/audio/include/uapi/**   ← 整个 uapi 目录没导入
          #     导致 wcdcal-hwdep.h 里 #include <audio/sound/msmcal-hwdep.h> 找不到
          K="$GITHUB_WORKSPACE/kernel"
          # 官方 MiCode 树是完整的 → 不需要镜像(省一次 ~200MB 下载)。
          # 只有 hmhmdcy 那棵被 .gitignore 误伤的树才需要补。
          if [ -f "$K/techpack/audio/include/uapi/audio/sound/msmcal-hwdep.h" ] \
             && [ -f "$K/arch/arm64/kernel/vmlinux.lds.S" ] \
             && [ -f "$K/include/asm-generic/vmlinux.lds.h" ]; then
            echo "✅ 树是完整的(官方源),跳过镜像补齐"
            exit 0
          fi
          echo "⚠️ 树不完整,开始从官方 star-r-oss 镜像缺失文件"
          UP_TGZ=/tmp/star-r-oss.tar.gz
          UP_URL=https://codeload.github.com/MiCode/Xiaomi_Kernel_OpenSource/tar.gz/refs/heads/star-r-oss
          if curl -fL --retry 3 --retry-all-errors -o "$UP_TGZ" "$UP_URL"; then
            echo "✅ 官方树下载完成 ($(du -h "$UP_TGZ" | cut -f1))"
          else
            echo "⚠️ 官方树下载失败 —— 退回逐个补关键文件"
            SRC=https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/star-r-oss
            for f in arch/arm64/kernel/vmlinux.lds.S include/asm-generic/vmlinux.lds.h \
                     techpack/audio/include/uapi/audio/sound/msmcal-hwdep.h; do
              [ -f "$K/$f" ] && { echo "已存在: $f"; continue; }
              mkdir -p "$K/$(dirname "$f")"
              curl -fsSL --retry 3 "$SRC/$f" -o "$K/$f" \
                && echo "✅ 补齐 $f ($(wc -c < "$K/$f") 字节)" || echo "⚠️ 拉取失败: $f"
            done
          fi
          if [ -s "$UP_TGZ" ]; then
            rm -rf /tmp/off && mkdir -p /tmp/off && tar xzf "$UP_TGZ" -C /tmp/off
            OFF=$(find /tmp/off -maxdepth 1 -mindepth 1 -type d | head -1)
            if [ -d "$OFF" ]; then
              # 只补【缺失】的文件,绝不覆盖 hmhmdcy 已有的改动
              MISS=$( cd "$OFF" && find . -type f | while IFS= read -r f; do
                        [ -e "$K/$f" ] || echo "$f"; done )
              echo "缺失文件总数: $(printf '%s\n' "$MISS" | grep -c .)"
              printf '%s\n' "$MISS" | grep . | head -40
              printf '%s\n' "$MISS" | grep . | while IFS= read -r f; do
                mkdir -p "$K/$(dirname "$f")"; cp "$OFF/$f" "$K/$f"; done
            fi
            rm -f "$UP_TGZ"
          fi
          echo "=== 检查 ==="
          ls -la "$K/arch/arm64/kernel/vmlinux.lds.S" \
                 "$K/include/asm-generic/vmlinux.lds.h" \
                 "$K/techpack/audio/include/uapi/audio/sound/msmcal-hwdep.h" 2>&1

      # ── 接入 logdump:内核日志周期性落盘(见 patches/logdump.c)──
# ── fbcon 修复:让 techpack 的 msm_drm 整体编入 ─────────────
      # 之前漏编的对象 msm_fb.o / msm_gem.o 等嵌在 techpack 的
      #   msm_drm-$(CONFIG_DRM_MSM) += ...
      # 列表里;我们的 .config 里 CONFIG_DRM_MSM 没开 → 整个 msm_drm 不编,
      # 链接报缺 msm_framebuffer_bo / msm_gem_* 等符号。
      # 改法:把这两个条件改成无条件,让 techpack 整体编入。
      - name: fbcon 修复 v2(去掉 CONFIG_DRM_MSM 开关)
        continue-on-error: true
        run: |
          cd kernel
          # ★★ 这段手术【只对旧树(EcrosoftXiao/mars)有意义】,对 star 树有害:
          #   star 的 techpack/display/msm/Makefile 里有【多条】
          #     msm_drm-$(CONFIG_DRM_MSM) += ...
          #   第 128 行是显示核心(dsi/sde/...),第 142 行起是 mi_disp/*.o。
          #   旧 sed 把它们统统改成 `msm_drm-y :=` —— 而 `:=` 是【立即赋值、
          #   后者覆盖前者】⇒ 第 142 行把第 128 行的核心全盖掉 ⇒
          #   mi_disp 编进来了、dsi/sde 核心没编 ⇒ vmlinux 链接报 20 个
          #   undefined(dsi_display_* / sde_* / mi_dsi_* 互引)。
          #   star 树由 QGKI 片段链正常开启 CONFIG_DRM_MSM,根本不需要动 Makefile。
          if [ -f arch/arm64/configs/vendor/star_QGKI.config ]; then
            echo "star(QGKI 片段链)树:跳过 Makefile 手术(会覆盖显示核心列表)"
            echo -n "  该 Makefile 里 msm_drm-\$(CONFIG_DRM_MSM) += 的行数: "
            grep -c 'msm_drm-\$(CONFIG_DRM_MSM) +=' techpack/display/msm/Makefile || true
            exit 0
          fi
          sed -i 's|^msm_drm-$(CONFIG_DRM_MSM) +=|msm_drm-y :=|' techpack/display/msm/Makefile
          sed -i 's|^obj-$(CONFIG_DISPLAY_BUILD)	+= msm_drm.o|obj-y	+= msm_drm.o|' techpack/display/msm/Makefile
          echo "=== 修改后 techpack Makefile 关键行 ==="
          grep -n 'msm_drm[-y]' techpack/display/msm/Makefile | head -6
      - name: 接入 logdump(内核日志落盘)
        if: ${{ matrix.nologdump != '1' }}
        continue-on-error: true
        run: |
          cd kernel
          if [ -f ../patches/logdump.c ]; then
            cp ../patches/logdump.c drivers/soc/qcom/logdump.c
            # 直接挂进 Makefile,不需要改 Kconfig
            grep -q 'logdump.o' drivers/soc/qcom/Makefile || echo 'obj-y += logdump.o' >> drivers/soc/qcom/Makefile
            echo "=== logdump 接入情况 ==="
            ls -la drivers/soc/qcom/logdump.c
            tail -3 drivers/soc/qcom/Makefile
          else
            echo "::error::找不到 patches/logdump.c"
            exit 1
          fi

      # ── v4.10 诊断插桩:导出 module_mutex 持有者与全部模块状态 ─────
      #    模块加载死锁时,这是唯一能直接指出「谁拿着锁 / 谁卡在 COMING」的信息
      - name: 诊断插桩 module_mutex/模块状态
        continue-on-error: true
        run: |
          cd kernel
          if grep -q moddbg_dump kernel/module.c; then
            echo "已存在,跳过"
          else
            cat ../patches/moddbg.c >> kernel/module.c
            echo "已追加诊断钩子"
          fi
          grep -n "moddbg_dump\|moddbg_mutex_owner" kernel/module.c | head -5

      # ── MIUI 私有符号桩:让原厂 vendor .ko 能装进来 ──────────────
      #    vermagic/MODVERSIONS 解决后,剩下的失败模块缺的是 MIUI 私有符号
      #    (power_debug_print_enabled / mi_power_save_battery_cave /
      #     refcount_warn_saturate / mi_display_pm_suspend_callback_set),
      #    这些符号守护在 m2y 关掉的私有开关下面 ⇒ 这里以桩形式补上。
      #    效果:充电器模块(WiFi/电池)与 WLAN 模块可加载。
      - name: MIUI 私有符号桩
        run: |
          cd kernel
          if [ -f ../patches/mi_syms.c ]; then
            cp ../patches/mi_syms.c drivers/soc/qcom/mi_syms.c
            grep -q 'mi_syms.o' drivers/soc/qcom/Makefile || echo 'obj-y += mi_syms.o' >> drivers/soc/qcom/Makefile
            echo "=== mi_syms 接入情况 ==="
            ls -la drivers/soc/qcom/mi_syms.c
            tail -3 drivers/soc/qcom/Makefile
          else
            echo "::error::找不到 patches/mi_syms.c"
            exit 1
          fi

      # ── 中立化 MIUI 的「长按组合键 → 重启」──────────────────────
      #    症状:自编内核开机约 9.7 秒必定重启(关机流程再卡 2.5~3 分钟),
      #    证据:sde59 logdump 里 "collect D&R-state processes info before
      #    long comb key" → 紧接着 "Synchronizing SCSI cache";
      #    源码:drivers/input/misc/qpnp-power-on.c 的 longpress_kthread()
      #    里 machine_restart(NULL)。原厂内核从不触发。
      - name: ★ 注入 dummy-psy（早期 power_supply，骗过 init 5s wait）
        run: |
          cd kernel
          if [ -f ../patches/dummy-psy.c ]; then
            cp ../patches/dummy-psy.c drivers/soc/qcom/dummy_psy.c
            grep -q 'dummy_psy.o' drivers/soc/qcom/Makefile || echo 'obj-y += dummy_psy.o' >> drivers/soc/qcom/Makefile
            echo "  已注入 dummy_psy.c"
            ls -la drivers/soc/qcom/dummy_psy.c
          else
            echo "::error::找不到 patches/dummy-psy.c"
            exit 1
          fi

      - name: ★★ 对齐 vendor 的 pmic_glink 状态机（修充电器 probe 不触发）
        continue-on-error: true
        run: |
          cd kernel
          python3 ../patches/pmic-glink-fix.py . || echo "::warning::pmic-glink-fix 未生效"
          echo "--- 自证:DOWN 分支 ---"
          grep -n -A4 "case SERVREG_NOTIF_SERVICE_STATE_DOWN_V01" drivers/soc/qcom/pmic_glink.c | head -8

      - name: ★★ 对齐 vendor 的 msm_pcie ABI 布局（修 WiFi 的 PCIe 事件登记）
        continue-on-error: true
        run: |
          cd kernel
          python3 ../patches/msm-pcie-hdr.py . || echo "::warning::msm-pcie-hdr 未生效"
          echo "--- 自证:结构体第一字段 ---"
          sed -n '/struct msm_pcie_register_event {/,/};/p' include/linux/msm_pcie.h | head -4

      - name: ★ 注入 mod-blacklist（拒绝挂死的 vendor 模块）
        run: |
          cd kernel
          MARS_ALLOW="${{ github.event.inputs.allowlist }}" python3 ../patches/mod-blacklist.py .
          grep -n "mars-module-blacklist" kernel/module.c | head -5
          grep -q "mars-module-blacklist" kernel/module.c \
            || { echo "::error::mod-blacklist 未注入"; exit 1; }
          echo "✅ mod-blacklist 已注入"

      - name: 中立化 longpress 重启
        run: |
          cd kernel
          python3 ../patches/no-longpress.py .

      # ── 关掉 PMIC(PON)看门狗:约 128 秒硬复位的真凶 ──────────────
      - name: 关闭 PMIC 看门狗
        run: |
          cd kernel
          python3 ../patches/no-pmic-wd.py .

      # ── 补上公开树缺失的 MIUI 声明 ──────────────────────────────
      #    run 36951823865 实测:CONFIG_DEBUG_POWER_MI=y 时
      #    kernel/power/suspend.c 报 pm_system_dbg_info_print 隐式声明 +
      #    DEBUG_INFO_RPM_STATS 未定义。**不能**因此关掉这个开关 ✗
      #    (它是 power_debug_print_enabled 的来源 ⇒ 原厂充电器模块的命门),
      #    只把这两句调试打印去掉。
      - name: 补 MIUI power debug 声明
        run: |
          cd kernel
          python3 ../patches/fix-debug-power-mi.py .

      # ── 固件加载器:对 -EACCES 重试(见 patches/fw-retry.py)──────────
      #    自编内核启动比原厂快 ~7 秒 ⇒ 5.67s 就请求 A660 GPU 固件,而那时
      #    /vendor/firmware 对内核还不可读(-EACCES)、ueventd 也还不能服务 sysfs
      #    回退 ⇒ GPU 固件永久加载失败 ⇒ surfaceflinger 'no suitable EGLConfig
      #    found' 自杀 ⇒ 启动循环。这里对 -EACCES 重试最多 10 秒。
      #    ⚠️ 故意【不加 continue-on-error】:补丁打不上就必须让构建失败,
      #       否则又会静默丢掉这个关键修复(参照 TAKEOVER.md §32 的教训)。
      # ── 固件加载器 -EACCES 重试补丁(保留)──────────────────────────
      #    自编内核启动比原厂快 ~7 秒 ⇒ 5.67s 就请求 A660 GPU 固件,那时
      #    /vendor/firmware 对内核还不可读(-EACCES)⇒ GPU 固件永久失败 ⇒
      #    surfaceflinger 拿不到 EGLConfig 自杀。这里对 -EACCES 重试最多 10 秒。
      - name: 固件加载器 -EACCES 重试补丁
        run: |
          cd kernel
          python3 ../patches/fw-retry.py
          grep -n "mars 补丁" -A3 drivers/base/firmware_loader/main.c | head -12

      # ── 固件"用户态回退"超时 60s → 5s(拆掉 module_mutex 循环等待)──
      #    sde59 铁证(开机 49.8~54.7s 全任务栈):
      #      modprobe D ... request_firmware_work_func   ← 固件落到用户态回退
      #      modprobe D ... __mutex_lock ... load_module ← 模块 init 在等 module_mutex
      #      init(用户态)卡在等 vendor_modprobe 批量
      #    ⇒ cnss2/WLAN 那类模块在 init 里 request_firmware,直接读失败后
      #      落到回退,而用户态 init 正等这批模块 ⇒ 循环等待 ⇒ 该模块 init
      #      永不返回 ⇒ module_mutex 被永久占住 ⇒ msm_drm/触摸/电池等 29 个
      #      模块全装不上(症状:无显示、无 WiFi)。
      #    ⇒ 只把回退超时改小(机制保留):5 秒等不到就放弃 ⇒ 模块快速失败
      #      ⇒ 锁释放 ⇒ 其余模块正常装载。详见 patches/fw-timeout.py。
      # ── ⛔ 固件回退超时【保持原厂 60 秒】,不再改成 5 秒 ──────────────
      #   2026-10-03 复盘:这一改是"卡在 LOGO+小绿人"的最大嫌疑 ✗
      #   证据链:
      #     · TAKEOVER.md §70(2026-10-02 18:42)记录过 star-stock-raw 之前身
      #       【boot_completed=1,35.5 秒进系统,稳定 3 分 10 秒】,只有 WiFi 不通;
      #       当时的构建【没有】fw-timeout。
      #     · 本 workflow 自己的注释早就写过:GPU 固件加载失败 ⇒
      #       surfaceflinger 报 "no suitable EGLConfig found" 自杀 ⇒ 起不到桌面。
      #     · 回退超时 60s→5s 之后,凡是走"用户态回退"的固件(GPU/ADSP/WLAN/触摸)
      #       都更容易超时失败 ⇒ 桌面永远起不来 ⇒ 停在 LOGO 阶段等看门狗。
      #   ⇒ 恢复原厂值。若将来确实需要改小,必须先用 cmdline 二分验证。
      - name: ★ 应用 fw-timeout.py（固件回退超时 60→1 秒）
        run: |
          cd kernel
          # GPU(A660) 固件已 CONFIG_EXTRA_FIRMWARE 内嵌,不走用户态回退。
          # 但 vendor 触摸/WLAN 等模块的 request_firmware 会卡住 vendor_modprobe
          # 的 exec ⇒ init 等 52s ⇒ 关机。2 秒快速失败 ⇒ 锁释放,其余模块可装。
          python3 ../patches/fw-timeout.py .
          F=drivers/base/firmware_loader/fallback_table.c
          grep -nE "loading_timeout|old_timeout" "$F" | head -5
          grep -qE "\.loading_timeout[[:space:]]*=[[:space:]]*1\b" "$F" \
            || { echo "::error::fw-timeout 未生效"; exit 1; }
          echo "✅ 固件回退超时 = 2s"

      # ── 取消导出 RDDM MHI 符号:⚠️ 2026-10-02 实测【会让内核启动前就复位】──
      #    (f932d6a8 那版 + KILL CONFIG_CNSS2 一起上,结果 3~4 秒一轮的 LOGO↔黑屏循环,
      #     连内核都没跑起来)⇒ 已撤回。保留 patches/unexport-mhi.py 备查。

      # ── KGSL:补上 KGSL_PROP_VK_DEVICE_ID(★★ surfaceflinger 起不来的真正根因)──
      #    铁证(从失败启动的用户态 logcat 抓到,2026-10-02):
      #      E Adreno-GSL: Error -2 attempting to get the VK_DEVICE_ID property
      #      W libEGL  : eglInitialize(...) failed (EGL_BAD_ALLOC)
      #      F RenderEngine: no suitable EGLConfig found, giving up
      #    ⇒ 我们这棵树(官方 star-r-oss,A11 时代)的 KGSL 比原厂 A13 内核旧,
      #      少这一个属性;原厂用户态 libgsl.so 里就有
      #      "KGSL_PROP_VK_DEVICE_ID not available at run time"。
      #    详见 patches/vkdevid.py 顶部注释(含同 SM8350 的参考实现)。
      #    ⚠️ 故意【不加 continue-on-error】:打不上必须让构建失败。
      - name: KGSL VK_DEVICE_ID 属性补丁
        run: |
          cd kernel
          python3 ../patches/vkdevid.py
          grep -n "KGSL_PROP_VK_DEVICE_ID" include/uapi/linux/msm_kgsl.h drivers/gpu/msm/adreno.c | head -8

      # ── vergmagic:让自编内核与原厂 vermagic 逐字节一致 ⇒ 原厂 .ko 能装进来 ──
      #    配套:配置里关掉 CONFIG_MODVERSIONS(跳过符号 CRC 校验)。
      #    这样原厂 vendor 模块(WLAN/相机/音频/ADSP/biometric...)都能加载,
      #    不必再手写驱动。详见 patches/vermagic.py 顶部注释。
      #    ⚠️ 不加 continue-on-error:打不上必须让构建失败。
      - name: vermagic 对齐原厂补丁
        run: |
          cd kernel
          python3 ../patches/vermagic.py
          grep -n "MODULE_VERMAGIC_MODVERSIONS" include/linux/vermagic.h
          grep -n "CONFIG_MODVERSIONS" out/.config 2>/dev/null || true

      # ── 解开看门狗的 range 锁 ────────────────────────────────
      - name: 对齐原厂 watchdog 时间
        continue-on-error: true
        run: |
          cd kernel
          python3 - <<'PY'
          p='drivers/soc/qcom/Kconfig'
          s=open(p).read()
          n=0
          for a,b in [('range 11000 11000','range 11000 60000'),
                      ('range 9360 9360','range 9360 45000')]:
              if a in s:
                  s=s.replace(a,b); n+=1
          open(p,'w').write(s)
          print('watchdog range 解锁处数:', n)
          PY
          grep -A 5 'config QCOM_WATCHDOG_BARK_TIME' drivers/soc/qcom/Kconfig | head -7
          grep -A 5 'config QCOM_WATCHDOG_PET_TIME' drivers/soc/qcom/Kconfig | head -7

      # ── 内建编译所需的树内修复 ─────────────────────────────────
      - name: 打内建相关补丁
        continue-on-error: true
        if: matrix.variant != 'control' && matrix.variant != 'droidspaces'
        run: |
          cd kernel
          python3 - <<'PY'
          p='drivers/staging/qcacld-3.0/Kbuild'
          s=open(p).read()
          if 'ccflags-y += -Wno-error' not in s:
              old="""cppflags-y +=\t-DANI_OS_TYPE_ANDROID=6 \\
          \t\t-Wall\\
          \t\t-Werror\\
          \t\t-D__linux__"""
              new="""cppflags-y +=\t-DANI_OS_TYPE_ANDROID=6 \\
          \t\t-Wall\\
          \t\t-D__linux__

          # 内建编译时需要(本树顶层 Makefile 硬编码了 -Werror)
          ccflags-y += -Wno-error"""
              if old in s:
                  open(p,'w').write(s.replace(old,new,1)); print('qcacld -Wno-error 已加')
              else:
                  print('WARN: qcacld Kbuild 模板未匹配')
          else:
              print('qcacld 已打过补丁')
          PY
          # 重名符号:必须把【定义处和所有调用处】一起改名,只改其中一个文件会变成
          # undefined symbol(EndCredits 那棵树就是这么挂的)。所以整棵树一起改。
          mapfile -t QF < <(grep -rl 'nl80211hdr_put' drivers/staging/qca-wifi-host-cmn \
                                                 drivers/staging/qcacld-3.0 2>/dev/null)
          if [ "${#QF[@]}" -gt 0 ]; then
            sed -i 's/\bnl80211hdr_put\b/qca_nl80211hdr_put/g' "${QF[@]}"
            echo "已改名 ${#QF[@]} 个文件: ${QF[*]}"
          else
            echo "本树没有 nl80211hdr_put,跳过"
          fi

      # ── 去掉内核里 tracing_mark_write 的导出(解 vendor msm_drm.ko 撞名) ──
      #   实测日志(2026-10-03,1.42s):
      #     msm_drm: exports duplicate symbol __tracepoint_tracing_mark_write (owned by kernel)
      #     init: Failed to insmod '/lib/modules/msm_drm.ko' ...
      #   techpack/display/msm/Makefile:177 `obj-$(CONFIG_DISPLAY_BUILD) += msm_drm.o`
      #   ⇒ 显示驱动被编进 vmlinux,它的 EXPORT_TRACEPOINT_SYMBOL(tracing_mark_write)
      #     与 vendor msm_drm.ko 自己导出的那份撞名;complete_formation 里的
      #     verify_exported_symbols() 直接把模块拒掉 ⇒ 所有依赖 msm_drm 的原厂模块
      #     (触摸/充电/相机/LED/热控)连带失败。原厂显示由 vendor 模块驱动:
      #     readlink /sys/bus/platform/devices/ae00000.qcom,mdss_mdp/driver → msm_drm
      #   只注释【导出语句】,不动定义与调用;已核对 msm_drm.ko 的导入表里没有该符号。
      - name: ★ 去 tracing_mark_write 内核导出(解 vendor msm_drm.ko 冲突)
        run: |
          cd kernel
          python3 - <<'PY'
          import os, re
          hits = []
          for root, dirs, files in os.walk('.'):
              if root.startswith('./out'):
                  continue
              for f in files:
                  if not f.endswith(('.c', '.h')):
                      continue
                  p = os.path.join(root, f)
                  try:
                      lines = open(p, errors='ignore').read().splitlines()
                  except Exception:
                      continue
                  for i, l in enumerate(lines):
                      if 'EXPORT_TRACEPOINT_SYMBOL' in l and 'tracing_mark_write' in l:
                          hits.append((p, i + 1, l.strip()))
          print('=== 含 EXPORT_TRACEPOINT_SYMBOL + tracing_mark_write 的行 ===')
          for p, n, l in hits:
              print('  %s:%d  %s' % (p, n, l))
          if not hits:
              print('  (未找到导出语句;列出所有提到 tracing_mark_write 的源文件供排查)')
              for root, dirs, files in os.walk('.'):
                  if root.startswith('./out'):
                      continue
                  for f in files:
                      if f.endswith(('.c', '.h')):
                          p = os.path.join(root, f)
                          try:
                              if 'tracing_mark_write' in open(p, errors='ignore').read():
                                  print('   ', p)
                          except Exception:
                              pass
              raise SystemExit(0)
          changed = 0
          for p in sorted({h[0] for h in hits}):
              s = open(p, errors='ignore').read()
              s2 = re.sub(r'(?m)^([ \t]*)(EXPORT_TRACEPOINT_SYMBOL[_A-Z0-9]*[ \t]*\([ \t]*tracing_mark_write[ \t]*\)[ \t]*;)',
                          r'\1/* removed by CI (vendor msm_drm.ko exports it): \2 */', s)
              if s2 != s:
                  open(p, 'w').write(s2)
                  changed += 1
                  print('  已注释导出: %s' % p)
          print('共修改 %d 个文件' % changed)
          PY
          echo "=== 复核 ==="
          grep -rn "EXPORT_TRACEPOINT_SYMBOL.*tracing_mark_write" --include=*.c --include=*.h . | grep -v "removed by CI" | head -5 || echo "  ✅ 已无有效导出语句"

      # ── ★★★ v4:不把 techpack 显示驱动编进内核 ──────────────────────
      #   证据(2026-10-03 v3 现场日志,13.4s):
      #     msm_drm: module is already loaded      ← 不再是符号冲突,而是【名字被占】
      #     ⇒ 内核里内建的 techpack 显示驱动注册了 msm_drm(/sys/module/msm_drm 存在)
      #     ⇒ modprobe 拒装 vendor msm_drm.ko ⇒ 依赖它的 充电/触摸/相机 全装不上
      #       (13.34s: wait for '/sys/class/power_supply/usb/type' timed out)
      #   为什么现在能删:之前删了会链接失败(mi_disp_register_client undefined),
      #     因为树内【自己也编了】cyttsp5/fts/qti_battery_charger 模块 ✗;
      #     这些模块已在 v3 里关掉 ⇒ 现在整块去掉显示驱动是安全的 ✓
      - name: ★ v4 不把 techpack 显示驱动编进内核(解 msm_drm 名字被占)
        run: |
          cd kernel
          MF=techpack/display/msm/Makefile
          test -f "$MF" || { echo "::error::找不到 $MF"; exit 1; }
          echo "=== 改前 ==="; grep -nE "obj-.*msm_drm\.o" "$MF" || echo "  (无)"
          sed -i -E 's|^([[:space:]]*obj-[^[:space:]]*[[:space:]]*\+=[[:space:]]*msm_drm\.o.*)$|# disabled by CI (vendor msm_drm.ko owns the display): \1|' "$MF"
          echo "=== 改后 ==="; grep -nE "msm_drm\.o|disabled by CI" "$MF" | head -3
          grep -q "disabled by CI" "$MF" || { echo "::error::没能注释掉 msm_drm.o"; exit 1; }

      # ── 精确取消内核里与 vendor msm_drm.ko 撞名的导出(43 个) ────────
      #   集合算法:msm_drm.ko 自己的 __ksymtab(53 个导出)∩ 我们内核的导出 = 43 个。
      #   为什么能取消:内建代码互相引用在 vmlinux 链接期解析,不需要 EXPORT_SYMBOL
      #     (实测:整块删掉 techpack 反而报 mi_disp_register_client undefined,
      #      说明有内建使用方 —— 但使用方不需要"导出");
      #   其它厂商模块若需要这些符号,会从 msm_drm.ko 取(它就是导出者,
      #     modules.dep 保证 msm_drm 先加载)⇒ 与原厂行为完全一致 ✓
      - name: ★ 精确取消内核里与 vendor msm_drm.ko / hwid.ko 撞名的导出(43+9)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import os, re
          NAMES = ['dss_reg_w', 'dss_reg_r', 'dss_reg_dump', 'msm_dss_ioremap_byname', 'msm_dss_iounmap', 'msm_dss_get_pmic_io_mem', 'msm_dss_get_io_mem', 'msm_dss_clean_io_mem', 'msm_dss_get_io_irq', 'msm_dss_clean_io_irq', 'msm_dss_get_vreg', 'msm_dss_enable_vreg', 'msm_dss_enable_gpio', 'msm_dss_put_clk', 'msm_dss_get_clk', 'msm_dss_single_clk_set_rate', 'msm_dss_clk_set_rate', 'msm_dss_enable_clk', 'sde_i2c_byte_read', 'sde_i2c_byte_write', 'msm_register_vm_event', 'msm_unregister_vm_event', 'sde_rsc_client_create', 'sde_rsc_client_destroy', 'sde_rsc_register_event', 'sde_rsc_unregister_event', 'is_sde_rsc_available', 'get_sde_rsc_current_state', 'sde_rsc_client_state_update', 'sde_rsc_client_vote', 'sde_rsc_client_trigger_vote', 'dsi_bridge_interface_enable', 'msm_ioctl_rmfb2', 'msm_hdcp_register_cb', 'msm_hdcp_notify_topology', 'msm_hdcp_cache_repeater_topology', 'mi_disp_register_client', 'mi_disp_unregister_client', 'mi_disp_notifier_call_chain', 'disp_log_printk', 'disp_log_printk_utc', 'mi_display_pm_suspend', 'mi_disp_set_fod_queue_work', 'dwc3_core_init', 'xhci_get_sec_event_ring_phys_addr', 'ipa_is_ready']
          print('目标符号数:', len(NAMES))
          hits = {}
          for root, dirs, files in os.walk('.'):
              if root.startswith('./out'):
                  continue
              for f in files:
                  if not f.endswith('.c'):
                      continue
                  p = os.path.join(root, f)
                  try:
                      src = open(p, errors='ignore').read()
                  except Exception:
                      continue
                  got = []
                  for n in NAMES:
                      pat = re.compile(r'(?m)^([ \t]*)(EXPORT_SYMBOL[_A-Z0-9]*[ \t]*\([ \t]*'
                                       + re.escape(n) + r'[ \t]*\)[ \t]*;)')
                      if pat.search(src):
                          got.append(n)
                          src = pat.sub(r'\1/* unexported by CI (vendor .ko exports it): \2 */', src)
                  if got:
                      hits[p] = got
                      open(p, 'w').write(src)
          tot = 0
          for p in sorted(hits):
              print('  ' + p + ': ' + str(len(hits[p])) + ' 个(' + ','.join(hits[p][:5]) + ')')
              tot += len(hits[p])
          print('共取消 ' + str(tot) + ' 个导出,涉及 ' + str(len(hits)) + ' 个文件')
          miss = [n for n in NAMES if not any(n in v for v in hits.values())]
          if miss:
              print('WARN 未找到导出语句(可能在头文件):', miss)
          PYEOF

      # ── ★ 导出 MIUI 热控符号(vendor mi_thermal_interface.ko 需要)──────
      #   star-r-oss 的 drivers/thermal/thermal_core.c 里 thermal_class /
      #   thermal_message_dev 是 static 且全树无 EXPORT_SYMBOL ⇒ 它们虽被编进
      #   vmlinux(CONFIG_THERMAL=y / CONFIG_QTI_THERMAL=y)却只进 kallsyms、
      #   不进 __ksymtab ⇒ 原厂 mi_thermal_interface.ko 报 Unknown symbol。
      #   原厂内核是全局导出的(kallsyms: thermal_class=D / thermal_message_dev=B)。
      #   实测 vendor msm_drm.ko 并【不】导出这两个符号(readelf 核对 55 个
      #   __ksymtab),所以导出它们不会造成 duplicate symbol 拒装。
      #   ⚠️ 必须排在上面「精确取消撞名导出」步骤【之后】,否则本步刚补的
      #      EXPORT_SYMBOL 会被那一步按 NAMES 注释掉(静默失效)。
      #   详见 work/thermal-export-fix/README.md
      - name: ★ 导出 thermal_class / thermal_message_dev(vendor mi_thermal_interface.ko)
        run: |
          cd kernel
          python3 ../patches/thermal-export.py .
          echo "--- 导出语句 ---"
          grep -nE 'EXPORT_SYMBOL\(thermal_(class|message_dev)\)' drivers/thermal/thermal_core.c
          echo "--- 定义(不应再带 static)---"
          grep -nE '^(static )?struct (class|device) thermal_(class|message_dev)' drivers/thermal/thermal_core.c

      # ── KernelSU ──────────────────────────────────────────────
      - name: 集成 KernelSU
        if: matrix.ksu == '1'
        env:
          KSU_TAG: ${{ github.event.inputs.ksu_tag }}
        run: |
          cd kernel
          TAG="${KSU_TAG:-v0.7.6}"
          echo "集成 KernelSU $TAG"
          git clone --depth=1 --branch "$TAG" https://github.com/tiann/KernelSU.git drivers/kernelsu
          rm -rf drivers/kernelsu/.git
          if [ -d drivers/kernelsu/kernel ]; then
            shopt -s dotglob
            mv drivers/kernelsu/kernel/* drivers/kernelsu/
            rmdir drivers/kernelsu/kernel
          fi
          sed -i 's/^kernelsu-objs := apk_sign\.o$/obj-y += apk_sign.o/' drivers/kernelsu/Makefile || true
          sed -i '/^obj-y += kernelsu\.o$/d' drivers/kernelsu/Makefile || true
          grep -q 'CONFIG_KSU' drivers/Makefile || printf '\nobj-$(CONFIG_KSU)\t\t+= kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu' drivers/Kconfig || printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig

      # ── 对齐原厂:关掉这棵 backport 树独有的底层特性 ──────────────
      # 小米 5.4.233 原厂配置里【完全没有】RELR / STACKPROTECTOR_PER_TASK /
      # REFCOUNT_FULL,而这棵社区 backport 树把它们强制打开。三者都改内核最底层
      # 行为(自举重定位格式 / 栈金丝雀 / refcount_t 类型),其中 RELR 在 head.S
      # 就生效 —— 一旦出错的表现正好是「零日志 + bootloader 等几秒后重启」。
      # 前两个实测用 defconfig 关不掉(def_bool y / select),必须改 Kconfig。
      - name: 对齐原厂(关掉 RELR / PER_TASK / REFCOUNT_FULL)
        run: |
          cd kernel
          python3 - <<'PY'
          import re
          p = 'arch/Kconfig'
          s = open(p).read()
          s2 = re.sub(r'(config RELR\n\tbool "Use RELR relocation packing"\n)(\tdepends[^\n]*\n)(\tdefault )y',
                      r'\1\2\3n', s)
          if s2 != s:
              open(p, 'w').write(s2); print('RELR default y -> n')
          else:
              print('WARN: RELR 定义未匹配(可能本来就不是 default y)')

          p = 'arch/arm64/Kconfig'
          s = open(p).read()
          s2 = re.sub(r'(config STACKPROTECTOR_PER_TASK\n\tdef_bool )y', r'\1n', s)
          if s2 != s:
              open(p, 'w').write(s2); print('STACKPROTECTOR_PER_TASK def_bool y -> n')
          else:
              print('WARN: STACKPROTECTOR_PER_TASK 未匹配')

          s = open(p).read()
          s2 = re.sub(r'^\tselect REFCOUNT_FULL\n', '', s, flags=re.M)
          if s2 != s:
              open(p, 'w').write(s2); print('已移除 arch/arm64 的 select REFCOUNT_FULL')
          else:
              print('WARN: select REFCOUNT_FULL 未找到')
          PY

      # ── 清理树里的悬空 kernelsu 引用 ─────────────────────────
      # 第三方树普遍把 KernelSU 做成 patch:drivers/Kconfig 里留了 source 行、
      # drivers/Makefile 里留了 obj-y += kernelsu/,但目录并不在仓库里。
      # tanz3 甚至是 obj-y(无条件内建),不处理连 Kconfig 都解析不过。
      - name: 清理悬空 kernelsu 引用
        continue-on-error: true
        run: |
          cd kernel || exit 0
          if [ ! -e drivers/kernelsu/Makefile ]; then
            echo "drivers/kernelsu 不存在 → 清掉树里所有 kernelsu 引用"
            sed -i '/kernelsu/d' drivers/Kconfig drivers/Makefile 2>/dev/null || true
          else
            echo "drivers/kernelsu 存在(集成 KernelSU 的那一步已 clone),保留引用"
          fi
          echo "--- 剩余 kernelsu 引用 ---"
          grep -n kernelsu drivers/Kconfig drivers/Makefile 2>/dev/null || echo "  (无)"

      # ── 配置 ──────────────────────────────────────────────────
      - name: 生成 .config
        run: |
          set -euo pipefail
          cd kernel
          V="${{ matrix.variant }}"
          if [ "${{ matrix.directcfg }}" = "1" ]; then
            # ★★ 直用指定 defconfig(不拼 QGKI 片段链)——「原厂完整配置」路线。
            #    动机:片段链缺 62 个 MIUI 私有开关(触摸/充电/指纹/BT/NFC/SLIMBUS/MI_*),
            #    而 gh/configs/mars_qgki_ds_defconfig 就是设备原厂 /proc/config.gz
            #    原样 + 12 个 Droidspaces 开关(已逐项核对:2085 项零差异)。
            #    =m 的驱动则用 patches/m2y.py 选择性翻成 =y(原厂 .ko 因 CRC 装不进来)。
            DEF="${{ matrix.defconfig }}"
            mkdir -p arch/arm64/configs/vendor
            cp "../configs/$(basename "$DEF")" "arch/arm64/configs/$DEF"
            # ★ 变体带 noflip=1 时,让 m2y 只做 DISABLE、不把 =m 翻成 =y
            if [ "${{ matrix.noflip }}" = "1" ]; then
              M2Y_NOFLIP=1 python3 ../patches/m2y.py "arch/arm64/configs/$DEF"
              echo "本变体 NOFLIP=1:保持 =m,不内建 vendor 驱动"
            else
              python3 ../patches/m2y.py "arch/arm64/configs/$DEF"
            fi
            make O=out -j"$(nproc)" CC="$CC" LD="$LD" SUBLEVEL=${SUBLEVEL_OVERRIDE} "$DEF"
          elif [ -f arch/arm64/configs/vendor/star_QGKI.config ]; then
            # ★ QGKI 片段链树(小米官方 star/mars 源码 + Droidspaces 片段)
            #   参考 scripts/gki/generate_defconfig.sh:
            #   base_defconfig -> GKI -> QGKI -> consolidate -> (我们的)droidspaces
            #   触发条件用 star_QGKI.config(官方 MiCode 树也有它),
            #   而 star_droidspaces.config 只有 hmhmdcy 的树才有 → 没有就现场写。
            S=arch/arm64/configs
            if [ ! -f "$S/vendor/star_droidspaces.config" ]; then
              cat > "$S/vendor/star_droidspaces.config" <<'DSF'
          CONFIG_LOCALVERSION="-qgki-gbb70cde46897"
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_DEVTMPFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          # ★ 原厂 .ko 能装进来的关键:关掉符号 CRC 校验
          #   (vermagic 那边的 "modversions " 字样由 patches/vermagic.py 补)
          # CONFIG_MODVERSIONS is not set
          DSF
              echo "已现场写入 star_droidspaces.config(6 个开关)"
            fi
            echo "=== [QGKI 流程] 基础 defconfig ==="
            make O=out -j"$(nproc)" CC="$CC" LD="$LD" SUBLEVEL=${SUBLEVEL_OVERRIDE} gki_defconfig
            # ★★ 关键一步(之前一直漏掉,导致 vmlinux 链接一堆 undefined symbol):
            #   官方 generate_defconfig.sh 对 qgki 变体【不是直接用 star_GKI.config】,
            #   而是先跑 scripts/gki/fragment_allyesconfig.sh 把它转成 ALLYES 片段
            #   (该脚本就是 sed 's/=m$/=y/g',把 GKI 片段里的模块全变内建),
            #   再把 ALLYES 片段参与合并。
            #   少了这步 → CONFIG_QCOM_RPMH=m / HH_RM_DRV=m / MSM_GENI_SE=m ...
            #   而消费方 QCOM_RTB=y / QCOM_GUESTVM=y / I3C_MASTER_MSM_GENI=y
            #   → built-in 引用 module 符号 → vmlinux 链接必挂。
            ALLYES=$S/vendor/star_ALLYES_GKI.config
            if [ -f scripts/gki/fragment_allyesconfig.sh ]; then
              bash scripts/gki/fragment_allyesconfig.sh "$S/vendor/star_GKI.config" "$ALLYES" \
                && echo "✅ 生成 ALLYES 片段($(grep -c '=y$' "$ALLYES" 2>/dev/null) 个 =y)" \
                || { echo "⚠️ ALLYES 生成失败"; ALLYES=""; }
            else
              echo "⚠️ 本树无 fragment_allyesconfig.sh,退回原样使用 star_GKI.config"
              ALLYES=$S/vendor/star_GKI.config
            fi
            FRAGS=""
            # ★ 官方 qgki 变体的合并链是:
            #     base_defconfig → [allyes]GKI.config → QGKI.config → debugfs.config
            #   ★ 普通 qgki 变体【不包含 consolidate.config】(那是
            #     lahaina-qgki-consolidate_defconfig 变体才用的),之前误加,
            #     它带来的 PAGE_OWNER / DEBUG_PAGEALLOC / QCOM_RTB=y 等把水搅浑了。
            #   ★ debugfs.config 只在 TARGET_BUILD_VARIANT=user 时才加,且之前
            #     实测会让 mm/slub.o 编译失败(SLUB_DEBUG/PAGE_OWNER),继续排除。
            for f in "$ALLYES" "$S/vendor/star_QGKI.config" "$S/vendor/star_droidspaces.config"; do
              [ -n "$f" ] && [ -f "$f" ] && FRAGS="$FRAGS $f"
            done
            echo "=== 合并片段:$FRAGS"
            scripts/kconfig/merge_config.sh -O out -m out/.config $FRAGS
          else
            case "$V" in
              control) DEF=vendor/mars_stock_defconfig ;;
              *)       DEF="${{ matrix.defconfig }}" ;;
            esac
            mkdir -p arch/arm64/configs/vendor
            cp "../configs/$(basename "$DEF")" "arch/arm64/configs/$DEF"
            [ "$V" = "allbuiltin-ksu" ] && echo 'CONFIG_KSU=y' >> "arch/arm64/configs/$DEF"
            make O=out -j"$(nproc)" CC="$CC" LD="$LD" SUBLEVEL=${SUBLEVEL_OVERRIDE} "$DEF"
          fi
          if [ "${{ matrix.lto }}" = "none" ]; then
            scripts/config --file out/.config -d LTO_CLANG -d LTO_CLANG_THIN -e LTO_NONE
          fi
          # ★★★ 把 A660 GPU 固件【直接编进内核镜像】(CONFIG_EXTRA_FIRMWARE):
          #   内核内建固件表在文件系统 / SELinux / ueventd 之前被查找 ⇒ 彻底绕开
          #   "早期 /vendor/firmware 对内核不可读(-EACCES)+ ueventd 还没就绪" 的时序问题。
          #   实证:该时序问题让 Adreno GPU 永远起不来 ⇒ surfaceflinger 的 RenderEngine
          #   报 'no suitable EGLConfig found' 自杀 ⇒ 系统启动无限循环(106s 被 init 重启)。
          if [ -f ../firmware/a660_sqe.fw ]; then
            mkdir -p firmware/mars
            cp -f ../firmware/a660_* firmware/mars/
            ls -la firmware/mars/
            scripts/config --file out/.config \
              --set-str EXTRA_FIRMWARE "a660_sqe.fw a660_gmu.bin a660_zap.mdt a660_zap.b00 a660_zap.b01 a660_zap.b02" \
              --set-str EXTRA_FIRMWARE_DIR "firmware/mars"
            grep -E '^CONFIG_EXTRA_FIRMWARE' out/.config
          else
            echo "::warning::找不到 ../firmware/a660_*,跳过内建固件"
          fi
          # ⚠️ 已回退"把原厂配置里所有 =m 驱动改成内建(=y)"的做法(run 36877538492 实测):
          #   CONFIG_ICNSS2=y 会编译失败(drivers/soc/qcom/icnss2/qmi.h 的
          #   static inline stub 与真声明冲突),而且厂商模块(adsp_loader/camera/音频 codec)
          #   【根本不由 Kconfig 控制】—— 原厂配置里只有 68 个 =m,techpack 用自己的
          #   Makefile 决定 obj-m,所以"全部内建"这条路既不可行也不必要。
          #   模块加载问题改用"用户态加载"方案解决(见 TAKEOVER.md §59/§60)。
          make O=out -j"$(nproc)" CC="$CC" LD="$LD" SUBLEVEL=${SUBLEVEL_OVERRIDE} olddefconfig
          echo "=== kernelrelease ==="
          make -s O=out CC="$CC" LD="$LD" SUBLEVEL=${SUBLEVEL_OVERRIDE} kernelrelease
          echo "=== 关键项 ==="
          for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS USER_NS DEVTMPFS TMPFS_POSIX_ACL \
                   TMPFS_XATTR CGROUP_DEVICE CGROUP_PIDS NETFILTER_XT_MATCH_ADDRTYPE \
                   MODVERSIONS MODULE_SIG LTO_NONE LTO_CLANG LTO_CLANG_THIN CLANG_VERSION \
                   LOCALVERSION PSTORE_RAM KSU ARM64_ERRATUM_1742098 \
                   RELR TOOLS_SUPPORT_RELR STACKPROTECTOR_PER_TASK REFCOUNT_FULL ; do
            printf '  %-32s %s\n' "$c" "$(grep -m1 "^CONFIG_${c}=" out/.config || grep -m1 "^# CONFIG_${c} is not set" out/.config || echo '(不在本树)')"
          done
          echo "=== 与原厂配置差异 ==="
          python3 - "../configs/mars_stock_defconfig" out/.config <<'PY'
          import re,sys
          def load(p):
              d={}
              for l in open(p,errors='ignore'):
                  l=l.strip()
                  m=re.match(r'^(CONFIG_[A-Za-z0-9_]+)=(.*)$',l)
                  if m: d[m.group(1)]=m.group(2); continue
                  m=re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set$',l)
                  if m: d[m.group(1)]='n'
              return d
          a=load(sys.argv[1]); b=load(sys.argv[2])
          lost=[k for k,v in a.items() if v=='y' and b.get(k)!='y']
          print('  原厂 y 但本树丢掉/关掉: %d 项'%len(lost))
          print('  ' + ', '.join(sorted(lost)[:40]))
          print('  本树 y 而原厂非 y: %d 项'%sum(1 for k,v in b.items() if v=='y' and a.get(k)!='y'))
          PY

      # ── ★★★ 根因修复:struct module 必须与原厂逐字段一致 ──────────
      #   kernel/trace/Kconfig 里:
      #     config FTRACE_MCOUNT_RECORD { def_bool y; depends on DYNAMIC_FTRACE }
      #   GKI 片段合并会把 DYNAMIC_FTRACE 打开(它 default y)⇒ struct module 多了
      #     unsigned int num_ftrace_callsites; unsigned long *ftrace_callsites;
      #   把其后的 source_list/target_list/exit/refcnt 全部顶偏 16 字节。
      #   vendor .ko 内嵌的 struct module 是按【原厂布局】编的,而 MODVERSIONS=n
      #   又关掉了唯一能拦住它的 module_layout 校验 ⇒ 内核按错误偏移读写原厂模块的
      #   引用计数/依赖链表 ⇒ modprobe 永久卡在 module_mutex/module_wq。
      #   证据:faddr2line load_module+0x75c = add_unformed_module:3733,
      #         do_init_module+0xbc = do_init_module:3655(sde59 logdump 现场)。
      #   原厂 /proc/config.gz:DYNAMIC_FTRACE / FTRACE_MCOUNT_RECORD 均未设置。
      - name: ★ 关闭 DYNAMIC_FTRACE(修 struct module ABI 偏移)
        run: |
          cd kernel
          # ★ 2026-10-06 F21:纯原厂对照变体(stock-pure,nocore=1)必须【完全不动配置】——
          #   它的唯一目的就是量"这棵树本身"的 ABI 保真度;任何 -e/-d 都会污染该测量。
          if [ "${{ matrix.nocore }}" = "1" ]; then
            echo "本变体 nocore=1:跳过全部配置改写(纯原厂对照,只跑 olddefconfig)"
          else
          ./scripts/config --file out/.config \
            -d DYNAMIC_FTRACE -d DYNAMIC_FTRACE_WITH_REGS -d FTRACE_MCOUNT_RECORD \
            -e DETECT_HUNG_TASK -d BOOTPARAM_HUNG_TASK_PANIC --set-val DEFAULT_HUNG_TASK_TIMEOUT 15 \
            -e MAC80211 -d CFG80211_WEXT -d MAC80211_LEDS -d MAC80211_MESH \
            -e MACVLAN -e IPVLAN -e VXLAN -e NF_TABLES -e NF_NAT -e IP_NF_NAT \
            -d QTI_BATTERY_CHARGER \
            -d TOUCHSCREEN_CYPRESS_CYTTSP5 -d TOUCHSCREEN_CYPRESS_CYTTSP5_I2C \
            -d TOUCHSCREEN_CYPRESS_CYTTSP5_LOADER -d TOUCHSCREEN_CYPRESS_CYTTSP5_DEVICE_ACCESS \
            -d TOUCHSCREEN_ST_FTS_V521_SPI
          fi
          make O=out -j"$(nproc)" CC="$CC" LD="$LD" SUBLEVEL=${SUBLEVEL_OVERRIDE} olddefconfig
          # ★ 关掉树内自带的 触摸/充电 模块:它们 import mi_disp_register_client 等
          #   43 个被取消导出的符号 ⇒ modpost 报 undefined ✗;而设备上用的是 /vendor 里
          #   原厂的 cyttsp5*.ko / fts_touch_spi_k2.ko / qti_battery_charger_main.ko
          #   (通过 modules.dep 保证 msm_drm.ko 先加载 ⇒ 符号从它那里取)⇒ 树内这份多余。
          echo "=== struct module 布局相关开关 ==="
          for c in FUNCTION_TRACER DYNAMIC_FTRACE FTRACE_MCOUNT_RECORD FUNCTION_ERROR_INJECTION \
                   FTRACE TRACING EVENT_TRACING JUMP_LABEL BPF_EVENTS MODULE_UNLOAD CONSTRUCTORS \
                   LIVEPATCH CFI_CLANG KALLSYMS SMP TRACEPOINTS TREE_SRCU SYSFS GENERIC_BUG \
                   DETECT_HUNG_TASK DEFAULT_HUNG_TASK_TIMEOUT; do
            printf '  %-30s %s\n' "$c" "$(grep -m1 "^CONFIG_${c}=" out/.config || grep -m1 "^# CONFIG_${c} is not set" out/.config || echo '(不在本树)')"
          done
          if grep -q "^CONFIG_FTRACE_MCOUNT_RECORD=y" out/.config; then
            echo "::error::FTRACE_MCOUNT_RECORD 仍为 y ⇒ struct module 偏移仍与原厂不一致"; exit 1
          fi
          if ! grep -q "^CONFIG_FUNCTION_ERROR_INJECTION=y" out/.config; then
            echo "::error::FUNCTION_ERROR_INJECTION 被关掉 ⇒ struct module 尾部字段与原厂不一致"; exit 1
          fi
          echo "✅ FTRACE_MCOUNT_RECORD 已关,FUNCTION_ERROR_INJECTION 保留"
          echo "=== Droidspaces / WiFi 核心要件(必须内建) ==="
          # ★ 2026-10-06 修正(依据 Droidspaces 官方 Kernel Configuration Guide,GKI 章节):
          #   CGROUP_PIDS 从本清单【移除】。官方原话:该项只服务 --pids-limit,
          #   且 "BREAK the kABI and no patch covers them"(5.15 实测改动 4101 个导出符号 CRC),
          #   "Without these options Droidspaces still works: --cpus and --pids-limit are
          #    skipped with a warning"。⇒ 在 GKI 内核上它必须保持原厂值(=未设),
          #   否则原厂预编译模块按错误偏移运行 ⇒ 静默损坏(我们已实测到无声硬复位)。
          #   同时补入官方必需要求里我们确实已满足的两项:DEVTMPFS、NETFILTER_XT_MATCH_ADDRTYPE。
          CORE="MAC80211 MACVLAN IPVLAN VXLAN NF_TABLES USER_NS PID_NS IPC_NS SYSVIPC POSIX_MQUEUE CGROUP_DEVICE TMPFS_XATTR OVERLAY_FS VETH BRIDGE SECCOMP_FILTER DEVTMPFS NETFILTER_XT_MATCH_ADDRTYPE"
          bad=0
          for c in $CORE; do
            v=$(grep -m1 "^CONFIG_${c}=" out/.config | cut -d= -f2)
            printf '  %-22s %s\n' "$c" "${v:-无}"
            [ "$v" = "y" ] || bad=$((bad+1))
          done
          echo "=== NAT 附加项(尽力而为,不阻断构建) ==="
          for c in NF_NAT NFT_NAT NF_TABLES_INET IP_NF_NAT IP_NF_TARGET_MASQUERADE NETFILTER_XT_TARGET_MASQUERADE; do
            v=$(grep -m1 "^CONFIG_${c}=" out/.config | cut -d= -f2)
            printf '  %-34s %s\n' "$c" "${v:-无}"
          done
          if [ "${{ matrix.nocore }}" = "1" ]; then
            echo "（本变体 nocore=1:跳过核心要件断言 —— stock-pure 的目的就是零容器开关）"
          elif [ "$bad" != "0" ]; then
            echo "::error::有 $bad 项 Droidspaces 核心要件不是 =y(设备上没有对应厂商 .ko,必须内建)"
            exit 1
          fi
          if [ "${{ matrix.nocore }}" != "1" ]; then
            if grep -q "^CONFIG_CFG80211_WEXT=y" out/.config; then
              echo "::error::CFG80211_WEXT 仍为 y ⇒ struct wireless_dev 布局与原厂不一致"; exit 1
            fi
            echo "✅ Droidspaces/WiFi 要件齐备,MAC80211 内建,CFG80211_WEXT 已关"
          else
            echo "（本变体 nocore=1:跳过 CFG80211_WEXT 断言）"
          fi

      # ── 编译 ──────────────────────────────────────────────────
      - name: 编译
        run: |
          cd kernel
          set +e
          # KBUILD_MODPOST_WARN: 树内 camera.ko/cnss2.ko 引用 get_hw_*（已为让 vendor
          # hwid.ko 装载而取消导出）⇒ modpost 会报 undefined。降级为警告，不阻断构建；
          # 运行时由 /vendor/hwid.ko 提供这些符号（与 msm_drm 的 43 符号同一策略）。
          /usr/bin/time -v make -k O=out -j"$(nproc)" CC="$CC" LD="$LD" \
            SUBLEVEL=${SUBLEVEL_OVERRIDE} KCFLAGS=-Wno-error KBUILD_MODPOST_WARN=1 > /tmp/build.log 2>&1
          rc=$?
          mkdir -p ../artifacts
          cp /tmp/build.log ../artifacts/build.log 2>/dev/null || true
          echo "make 退出码: $rc"
          tail -25 /tmp/build.log
          if [ "$rc" -ne 0 ] || [ ! -f out/arch/arm64/boot/Image ]; then
            echo "=================== BUILD FAILED ==================="
            echo "--- 错误行 ---"
            grep -nE "error:|Error [0-9]+|No rule to make|not found|undefined reference" /tmp/build.log | head -40
            echo "--- 最后 150 行 ---"
            tail -150 /tmp/build.log
            exit 1
          fi

      # ── 断言:那 43 个撞名符号都不能再由内核导出 ──────────────
      - name: ★ 断言 撞名符号已不再由内核导出
        if: ${{ matrix.nocore != '1' }}
        run: |
          cd kernel
          test -f out/Module.symvers || { echo "::error::没有 out/Module.symvers"; exit 1; }
          python3 - <<'PYEOF'
          NAMES = ['dss_reg_w', 'dss_reg_r', 'dss_reg_dump', 'msm_dss_ioremap_byname', 'msm_dss_iounmap', 'msm_dss_get_pmic_io_mem', 'msm_dss_get_io_mem', 'msm_dss_clean_io_mem', 'msm_dss_get_io_irq', 'msm_dss_clean_io_irq', 'msm_dss_get_vreg', 'msm_dss_enable_vreg', 'msm_dss_enable_gpio', 'msm_dss_put_clk', 'msm_dss_get_clk', 'msm_dss_single_clk_set_rate', 'msm_dss_clk_set_rate', 'msm_dss_enable_clk', 'sde_i2c_byte_read', 'sde_i2c_byte_write', 'msm_register_vm_event', 'msm_unregister_vm_event', 'sde_rsc_client_create', 'sde_rsc_client_destroy', 'sde_rsc_register_event', 'sde_rsc_unregister_event', 'is_sde_rsc_available', 'get_sde_rsc_current_state', 'sde_rsc_client_state_update', 'sde_rsc_client_vote', 'sde_rsc_client_trigger_vote', 'dsi_bridge_interface_enable', 'msm_ioctl_rmfb2', 'msm_hdcp_register_cb', 'msm_hdcp_notify_topology', 'msm_hdcp_cache_repeater_topology', 'mi_disp_register_client', 'mi_disp_unregister_client', 'mi_disp_notifier_call_chain', 'disp_log_printk', 'disp_log_printk_utc', 'mi_display_pm_suspend', 'mi_disp_set_fod_queue_work', 'dwc3_core_init', 'xhci_get_sec_event_ring_phys_addr', 'ipa_is_ready']
          ours = set()
          for line in open('out/Module.symvers', errors='ignore'):
              f = line.split('\t')
              if len(f) >= 2:
                  ours.add(f[1].strip())
          bad = [n for n in NAMES if n in ours]
          if bad:
              print('::error::内核仍在导出这些撞名符号(会让 vendor msm_drm.ko 被拒装):')
              for n in bad:
                  print('   ', n)
              raise SystemExit(1)
          print('✅ 43 个撞名符号已全部不再由内核导出(vendor msm_drm.ko 可以加载)')

          # ★ 正向断言(2026-10-06 增加):这两个符号必须【由内核导出】。
          #   vendor mi_thermal_interface.ko(原厂 114 个模块之一,原厂上已加载、
          #   被 msm_drm 依赖)导入它们;原厂 kallsyms 里 thermal_class=D、
          #   thermal_message_dev=B。而 star-r-oss 上游把它们的定义写成 static
          #   且从无 EXPORT_SYMBOL ⇒ 必须由 patches/thermal-export.py 主动补导出。
          #   它们【不】在上面那份去导出清单里:实测 vendor msm_drm.ko 并不导出它们
          #   (readelf 核对 55 个 __ksymtab),故导出不会造成 duplicate symbol 拒装。
          #   详见 work/thermal-export-fix/README.md
          MUST_EXPORT = ['thermal_class', 'thermal_message_dev']
          lack = [n for n in MUST_EXPORT if n not in ours]
          if lack:
              print('::error::内核没有导出这些 MIUI 热控符号(vendor mi_thermal_interface.ko 会报 Unknown symbol):')
              for n in lack:
                  print('   ', n)
              raise SystemExit(1)
          print('✅ thermal_class / thermal_message_dev 已由内核导出(供 vendor mi_thermal_interface.ko)')
          PYEOF

      # ── 校验 ──────────────────────────────────────────────────
      - name: 校验产物
        run: |
          cd kernel
          IMG=out/arch/arm64/boot/Image
          mkdir -p ../artifacts
          cp out/.config ../artifacts/config.gz.txt 2>/dev/null || cp out/.config ../artifacts/
          {
            echo "variant      : ${{ matrix.variant }}"
            echo "desc         : ${{ matrix.desc }}"
            echo "defconfig    : ${{ matrix.defconfig }}"
            echo "kernel_sha   : ${KERNEL_SHA}"
            echo "kernelrelease: $(make -s O=out CC=$CC LD=$LD SUBLEVEL=${SUBLEVEL_OVERRIDE} kernelrelease)"
            echo "compiler     : $($CC --version | head -1)"
            echo "image_bytes  : $(stat -c%s $IMG)"
            echo "image_md5    : $(md5sum $IMG | cut -d' ' -f1)"
            echo "lto          : ${{ matrix.lto }} / ksu: ${{ matrix.ksu }}"
          } > ../artifacts/INFO.txt
          cat ../artifacts/INFO.txt
          echo "=== 内建证据(符号出现次数) ==="
          for s in wlan_hdd_cfg80211_init cnss_wlan_register_driver hdd_wlan_startup \
                   fts_touch_spi xiaomi_touch goodix_fod ufs_qcom_ sde_kms msm_drm ; do
            printf '  %-32s %s\n' "$s" "$(strings $IMG | grep -c "$s")"
          done
          echo "=== 版本串 ==="
          strings $IMG | grep -m1 '5.4.233-qgki' || echo "WARN: 未找到 5.4.233-qgki"
          if [ "${{ matrix.ksu }}" = "1" ]; then
            echo "=== KernelSU ==="; strings $IMG | grep -c 'KernelSU' || true
          fi
          ls -la ../artifacts

      # ── 诊断: 把 load_module 里的卡点偏移反查成源码行 ──────────
      - name: 诊断 load_module 卡点(addr2line)
        if: always()
        run: |
          cd kernel
          set +e
          V=out/vmlinux
          mkdir -p ../artifacts
          {
          echo "=== vmlinux ==="; ls -l "$V" 2>/dev/null
          NM=""; for t in "${CROSS_COMPILE}nm" llvm-nm nm; do command -v "$t" >/dev/null 2>&1 && { NM="$t"; break; }; done
          A2L=""; for t in "${CROSS_COMPILE}addr2line" llvm-addr2line addr2line; do command -v "$t" >/dev/null 2>&1 && { A2L="$t"; break; }; done
          echo "NM=$NM A2L=$A2L"
          echo "=== 关键符号 ==="
          "$NM" -n "$V" 2>/dev/null | grep -E " (load_module|do_init_module|add_unformed_module|simplify_symbols|resolve_symbol|check_version|layout_and_allocate|move_module|module_alloc|complete_formation|elf_validity_check|check_modinfo|copy_module_from_fd|__arm64_sys_finit_module)$"
          echo "=== faddr2line ==="
          for spec in load_module+0x75c load_module+0x1de4 load_module+0x31d8 do_init_module+0xbc; do
            echo "--- $spec ---"
            ./scripts/faddr2line "$V" "$spec" 2>&1 | head -25
          done
          echo "=== load_module 0x6c0..0x880 逐 4 字节 → 源码行 ==="
          LM=$("$NM" -n "$V" 2>/dev/null | awk '$3=="load_module"{print $1; exit}')
          echo "load_module=0x$LM"
          if [ -n "$LM" ] && [ -n "$A2L" ]; then
            ADDRS=""; OFFS=""; n=1728
            while [ "$n" -le 2176 ]; do
              ADDRS="$ADDRS $(printf '0x%x' $((0x$LM + n)))"
              OFFS="$OFFS $(printf '0x%x' $n)"
              n=$((n + 4))
            done
            "$A2L" -f -e "$V" $ADDRS > /tmp/a2l.txt 2>/dev/null
            awk 'NR%2==1{fn=$0;next}{print fn"    "$0}' /tmp/a2l.txt > /tmp/a2l-pairs.txt
            paste -d'|' <(printf '%s\n' $OFFS) /tmp/a2l-pairs.txt
          fi
          echo "=== 完 ==="
          } 2>&1 | tee ../artifacts/DIAG-loadmodule.txt

      - name: kABI CRC 对照(决定原厂模块能否加载)
        run: |
          cd kernel
          SYM=out/Module.symvers
          cp "$SYM" ../artifacts/Module.symvers 2>/dev/null || true
          python3 - ../ref/stock-crcs.txt "$SYM" <<'PY' | tee ../artifacts/CRC-REPORT.txt
          import sys
          stock = {}
          for line in open(sys.argv[1]):
              n, c = line.rstrip("\n").split("\t")
              stock[n] = int(c, 16)
          ours = {}
          for line in open(sys.argv[2], errors="ignore"):
              f = line.split("\t")
              if len(f) >= 2:
                  try:
                      ours[f[1]] = int(f[0], 16)
                  except ValueError:
                      pass
          common = [k for k in stock if k in ours]
          match = [k for k in common if stock[k] == ours[k]]
          pct = 100.0 * len(match) / max(1, len(common))
          # ★★ 2026-10-06 护栏:先自证"这次对照真的量到了东西"。
          #   背景(血泪):run155~run164 连续 8 轮的 CRC-SUMMARY 都是 "0.00% (0/2223)",
          #   原因是 CONFIG_MODVERSIONS=n ⇒ 我们的 Module.symvers 里【0 条 CRC】
          #   (报告里的判据行: "跳过 __ksymtab: 条目数不一致 (7056 vs 0)")。
          #   即:那 8 轮的百分比是【哑的】,却被打印成一个看起来像结论的数字,
          #   极容易被误读成"兼容率 0%、没救了"。⇒ 数据无效时必须显式自我否定。
          valid = len(common) >= 100 and len(ours) > 100
          if not valid:
              print("::warning::CRC 对照【无效】:可比=%d 本次导出=%d —— 通常是 CONFIG_MODVERSIONS 未开"
                    "(本次 Module.symvers 无 CRC)。【不要】把下面的百分比当结论!"
                    % (len(common), len(ours)))
          print("原厂(vendor 114 个 .ko)导出符号 : %d" % len(stock))
          print("本次导出                        : %d" % len(ours))
          print("可比                            : %d" % len(common))
          print("CRC 完全相同                    : %d = %.2f%%%s"
                % (len(match), pct,
                   "   <- 越高越好,>99% 说明模块能直接加载" if valid
                   else "   ★★ 无效(本次无 CRC 数据,见上方 warning)"))
          miss = sorted(k for k in stock if k not in ours)
          print("本内核【完全没提供】的符号      : %d   <- 这个才是硬伤,越接近 0 越好" % len(miss))
          if miss:
              print("  " + ", ".join(miss[:30]))
          print()
          print("关键符号:")
          for k in ("module_layout", "platform_driver_unregister", "register_filesystem",
                    "__stack_chk_guard", "printk", "kmalloc_caches"):
              if k in stock:
                  o = ours.get(k)
                  print("  %-32s 原厂=0x%08x 本次=%s %s"
                        % (k, stock[k], ("0x%08x" % o) if o else "(未导出)",
                           "OK" if o == stock[k] else "MISMATCH"))
          bad = sorted(k for k in common if stock[k] != ours[k])
          print()
          print("不匹配的前 50 个:")
          print("  " + ", ".join(bad[:50]))
          with open("../artifacts/CRC-SUMMARY.txt", "w") as fh:
              fh.write("%.2f%% (%d/%d)%s\n"
                       % (pct, len(match), len(common),
                          "" if valid else "  ★★无效:无可比CRC数据(CONFIG_MODVERSIONS 未开?)"))
          PY
          echo "=== 内核完整性:原厂 2360 个符号里我们导出了多少 ==="
          python3 ../tools/patch-crcs.py ../ref/stock-crcs.txt out/vmlinux --dry-run 2>&1 \
            | tee -a ../artifacts/CRC-REPORT.txt | head -8
          echo "| 变体 | CRC 匹配率 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.variant }} | $(cat ../artifacts/CRC-SUMMARY.txt) |" >> $GITHUB_STEP_SUMMARY

      - name: 打包 boot.img(可直接 fastboot)
        run: |
          cd kernel
          IMG=out/arch/arm64/boot/Image
          python3 ../tools/make-bootimg.py ../ref/boot-header.bin ../ref/boot-ramdisk.gz \
            "$IMG" "../artifacts/boot-${{ matrix.variant }}.img"
          ( cd ../artifacts && md5sum *.img > BOOT-IMGS.md5 )
          # 把编出来的模块打包 —— 后面要把它们塞进 vendor_boot 的 ramdisk 让 init 加载
          # 先 strip 再打包:未 strip 的 .ko 带着调试信息,单个可能几 MB,tgz 会到 170MB
          mkdir -p /tmp/kostrip
          for f in $(find out -name '*.ko'); do
            cp "$f" /tmp/kostrip/$(basename "$f")
            ${CROSS_COMPILE}strip --strip-debug /tmp/kostrip/$(basename "$f") 2>/dev/null || true
          done
          ( cd /tmp/kostrip && tar -czf "$GITHUB_WORKSPACE/artifacts/modules.tgz" *.ko )
          echo "strip 前后: $(du -sk /tmp/kostrip | cut -f1) KB"
          ls -la "$GITHUB_WORKSPACE/artifacts/modules.tgz"
          echo "modules.tgz: $(stat -c%s ../artifacts/modules.tgz 2>/dev/null || echo 0) 字节, 共 $(find out -name '*.ko' | wc -l) 个 .ko"
          ls -la ../artifacts/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mars-${{ matrix.variant }}-${{ env.KERNEL_SHA }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: ccache 统计
        if: always()
        run: ccache --show-stats || true
