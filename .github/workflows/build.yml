name: Build mars kernel (Droidspaces)

# 说明
# ────
# 目标设备: Xiaomi Mi 11 Pro (mars / mars_eea), Android 13, MIUI V14.0.7.0.TKAEUXM
# 目标内核: 5.4.233-qgki-gbb70cde46897, 原厂用 AOSP clang 11.0.2 (build 6877366) + LLD 构建
#
# 本工作流在 GitHub runner 上编译,产物是裸 Image。
# 打包成可 fastboot 的 boot.img 由仓库里的 tools/splice-bootimg.py 在本地完成
# (逐字节拼接原厂 boot.img,保留头部 32 字节原厂签名字段与原厂压缩 ramdisk)。
#
# 变体(variant):
#   control          原厂 .config 原样 + 上游源码不改动 —— 用来判断「源码/工具链本身能不能开机」
#   allbuiltin       全部驱动内建 + Droidspaces 需求项
#   allbuiltin-nolto 同上,但关掉 CONFIG_LTO_CLANG(排除 LTO 变量)
#   allbuiltin-ksu   同上 + 内置 KernelSU
#   droidspaces      驱动仍为模块 + Droidspaces 需求项(旧基线,仅作对照)

on:
  workflow_dispatch:
    inputs:
      variants:
        description: '要构建的变体(逗号分隔),留空=默认四个'
        required: false
        default: 'allbuiltin,allbuiltin-nolto,control,allbuiltin-ksu'
      toolchain:
        description: '工具链'
        required: true
        type: choice
        default: 'aosp-clang-11'
        options:
          - aosp-clang-11     # 原厂同款: Android clang 11.0.2 r383902b1 (build 6877366)
          - system-clang      # runner 自带 clang-14(仅作对照)
      ksu_tag:
        description: 'KernelSU tag(仅 allbuiltin-ksu 变体使用)'
        required: false
        default: 'v0.7.6'
env:
  ARCH: arm64
  # runner 是 x86_64,目标是 aarch64 → 必须交叉编译
  CROSS_COMPILE: aarch64-linux-gnu-
  SUBLEVEL_OVERRIDE: '233'
  UPSTREAM: https://github.com/EcrosoftXiao/kernel_xiaomi_mars.git
  UPSTREAM_BRANCH: twelve

jobs:
  # ── 把 variants 输入展开成 matrix ────────────────────────────────
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        env:
          SEL: ${{ github.event.inputs.variants }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          all_variants = {
              "control":          {"defconfig": "vendor/mars_stock_defconfig",        "lto": "keep", "ksu": "0", "desc": "原厂配置对照(源码不改)"},
              "allbuiltin":       {"defconfig": "vendor/mars_allbuiltin_defconfig",   "lto": "keep", "ksu": "0", "desc": "全内建 + Droidspaces"},
              "allbuiltin-nolto": {"defconfig": "vendor/mars_allbuiltin_defconfig",   "lto": "none", "ksu": "0", "desc": "全内建 + Droidspaces,关 LTO"},
              "allbuiltin-ksu":   {"defconfig": "vendor/mars_allbuiltin_defconfig",   "lto": "keep", "ksu": "1", "desc": "全内建 + Droidspaces + KernelSU"},
              "droidspaces":      {"defconfig": "vendor/mars_droidspaces_defconfig",  "lto": "keep", "ksu": "0", "desc": "模块式 + Droidspaces(旧基线)"},
          }
          sel = (os.environ.get("SEL") or "").strip()
          names = [s.strip() for s in sel.split(",") if s.strip()] if sel else \
                  ["allbuiltin", "allbuiltin-nolto", "control", "allbuiltin-ksu"]
          bad = [n for n in names if n not in all_variants]
          if bad:
              raise SystemExit("unknown variant(s): %s" % bad)
          inc = []
          for n in names:
              v = dict(all_variants[n]); v["variant"] = n
              inc.append(v)
          print("matrix=" + json.dumps({"include": inc}))
          PY
          cat "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.variant }}
    env:
      DEBIAN_FRONTEND: noninteractive
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ccache bison flex libssl-dev libelf-dev bc python3 \
            python-is-python3 gperf device-tree-compiler libncurses-dev \
            rsync unzip ca-certificates lz4 xz-utils cpio zip time \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # ── 工具链 ──────────────────────────────────────────────────
      - name: 安装原厂同款 clang 11.0.2 (r383902b1)
        if: github.event.inputs.toolchain != 'system-clang'
        run: |
          set -euo pipefail
          DEST="$HOME/aosp-clang"
          mkdir -p "$DEST"
          ok=0
          # 1) Google 官方 prebuilt(android12-release 分支里就是 r383902b1)
          for d in clang-r383902b1 clang-r383902b; do
            U="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/${d}.tar.gz"
            echo "尝试 $U"
            if curl -fsSL --retry 2 --connect-timeout 20 -o /tmp/clang.tgz "$U"; then
              rm -rf "$DEST"/*; tar -xzf /tmp/clang.tgz -C "$DEST" && ok=1 && break
            fi
          done
          # 2) GitHub 镜像(manifest_6877366 = 原厂 6877366)
          if [ "$ok" != 1 ]; then
            for r in credits-infra/clang-r383902b1 ruoqing501/clang-r383902b1 qssn70/clang-r383902b1; do
              U="https://codeload.github.com/${r}/tar.gz/refs/heads/main"
              echo "尝试镜像 $U"
              if curl -fsSL --retry 2 --connect-timeout 20 -o /tmp/clang.tgz "$U"; then
                rm -rf /tmp/clangx && mkdir -p /tmp/clangx && tar -xzf /tmp/clang.tgz -C /tmp/clangx
                SRC=$(find /tmp/clangx -maxdepth 1 -mindepth 1 -type d | head -1)
                if [ -x "$SRC/bin/clang" ]; then rm -rf "$DEST"/*; cp -a "$SRC"/. "$DEST"/; ok=1; break; fi
              fi
            done
          fi
          # 3) apt 兜底
          if [ "$ok" != 1 ]; then
            echo "::warning::AOSP prebuilt 下载失败,退回 apt clang-11"
            sudo apt-get install -y --no-install-recommends clang-11 lld-11 || true
            if command -v clang-11 >/dev/null; then
              mkdir -p "$DEST/bin"
              for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-ranlib llvm-readelf; do
                base=${t%-11}; [ -e "/usr/bin/${t}-11" ] && ln -sf "/usr/bin/${t}-11" "$DEST/bin/$base"
              done
              [ -e /usr/bin/ld.lld-11 ] && ln -sf /usr/bin/ld.lld-11 "$DEST/bin/ld.lld"
              ok=1
            fi
          fi
          [ "$ok" = 1 ] || { echo "::error::找不到 clang 11"; exit 1; }
          # clang 11 prebuilt 需要 libtinfo.so.5
          if [ ! -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi
          echo "$DEST/bin" >> $GITHUB_PATH
          "$DEST/bin/clang" --version || true

      - name: 选择工具链
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.toolchain }}" = "system-clang" ]; then
            echo "CC=clang"       >> $GITHUB_ENV
            echo "LD=ld.lld"      >> $GITHUB_ENV
          else
            echo "CC=clang"       >> $GITHUB_ENV
            echo "LD=ld.lld"      >> $GITHUB_ENV
          fi
          which clang; clang --version | head -2
          which ld.lld; ld.lld --version | head -1

      - name: ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.variant }}-${{ github.event.inputs.toolchain }}-${{ hashFiles('configs/**') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.variant }}-${{ github.event.inputs.toolchain }}-${{ hashFiles('configs/**') }}-
            ccache-${{ matrix.variant }}-${{ github.event.inputs.toolchain }}-

      - name: 配置 ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G"        >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1"        >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime" >> $GITHUB_ENV

      # ── 源码 ───────────────────────────────────────────────────
      - name: 拉取上游内核源码
        run: |
          git clone --depth=1 -b "${UPSTREAM_BRANCH}" "${UPSTREAM}" kernel
          cd kernel
          echo "KERNEL_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          : > .scmversion          # 抑制 git 后缀,保证 vermagic 精确可控
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile

      # ── Droidspaces kABI 补丁(control 变体不打)──────────────────
      - name: 应用 Droidspaces kABI 补丁
        if: matrix.variant != 'control'
        run: |
          cd kernel
          cp -r ../patches .
          patch -p1 -F5 --no-backup-if-mismatch \
            < patches/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch || true
          patch -p1 -F5 --no-backup-if-mismatch \
            < patches/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch || true
          rm -f patches/*.rej include/linux/sched/*.rej
          python3 - <<'PY'
          p='include/linux/sched/user.h'
          s=open(p).read()
          if 'ANDROID_KABI_USE(1, unsigned long mq_bytes)' not in s:
              old="""\t/* Miscellaneous per-user rate limit */
          \tstruct ratelimit_state ratelimit;

          \tANDROID_KABI_RESERVE(1);
          \tANDROID_KABI_RESERVE(2);
          };"""
              new="""\t/* Miscellaneous per-user rate limit */
          \tstruct ratelimit_state ratelimit;

          #if defined(CONFIG_POSIX_MQUEUE)
          \tANDROID_KABI_USE(1, unsigned long mq_bytes);
          \tANDROID_KABI_RESERVE(2);
          #else
          \tANDROID_KABI_RESERVE(1);
          \tANDROID_KABI_RESERVE(2);
          #endif
          };"""
              if old in s:
                  open(p,'w').write(s.replace(old,new,1)); print('user.h 手工修复完成')
              else:
                  print('WARN: user.h 未匹配手工修复模板'); raise SystemExit(1)
          else:
              print('user.h 已含 kABI 修复')
          PY
          echo "--- 校验 ---"
          grep -c 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem)' include/linux/sched.h
          grep -c 'ANDROID_KABI_USE(1, unsigned long mq_bytes)' include/linux/sched/user.h

      # ── 内建编译所需的树内修复 ─────────────────────────────────
      - name: 打内建相关补丁
        if: matrix.variant != 'control' && matrix.variant != 'droidspaces'
        run: |
          cd kernel
          python3 - <<'PY'
          p='drivers/staging/qcacld-3.0/Kbuild'
          s=open(p).read()
          if 'ccflags-y += -Wno-error' not in s:
              old="""cppflags-y +=\t-DANI_OS_TYPE_ANDROID=6 \\
          \t\t-Wall\\
          \t\t-Werror\\
          \t\t-D__linux__"""
              new="""cppflags-y +=\t-DANI_OS_TYPE_ANDROID=6 \\
          \t\t-Wall\\
          \t\t-D__linux__

          # 内建编译时需要(本树顶层 Makefile 硬编码了 -Werror)
          ccflags-y += -Wno-error"""
              if old in s:
                  open(p,'w').write(s.replace(old,new,1)); print('qcacld -Wno-error 已加')
              else:
                  print('WARN: qcacld Kbuild 模板未匹配')
          else:
              print('qcacld 已打过补丁')
          PY
          for f in drivers/staging/qca-wifi-host-cmn/utils/nlink/src/wlan_nlink_srv.c \
                   drivers/staging/qca-wifi-host-cmn/utils/nlink/inc/wlan_nlink_srv.h ; do
            sed -i 's/\bvoid \*nl80211hdr_put(/void *qca_nl80211hdr_put(/g; s/\bhdr = nl80211hdr_put(/hdr = qca_nl80211hdr_put(/g' "$f"
          done
          grep -c qca_nl80211hdr_put drivers/staging/qca-wifi-host-cmn/utils/nlink/src/wlan_nlink_srv.c

      # ── KernelSU ──────────────────────────────────────────────
      - name: 集成 KernelSU
        if: matrix.ksu == '1'
        env:
          KSU_TAG: ${{ github.event.inputs.ksu_tag }}
        run: |
          cd kernel
          TAG="${KSU_TAG:-v0.7.6}"
          echo "集成 KernelSU $TAG"
          git clone --depth=1 --branch "$TAG" https://github.com/tiann/KernelSU.git drivers/kernelsu
          rm -rf drivers/kernelsu/.git
          if [ -d drivers/kernelsu/kernel ]; then
            shopt -s dotglob
            mv drivers/kernelsu/kernel/* drivers/kernelsu/
            rmdir drivers/kernelsu/kernel
          fi
          sed -i 's/^kernelsu-objs := apk_sign\.o$/obj-y += apk_sign.o/' drivers/kernelsu/Makefile || true
          sed -i '/^obj-y += kernelsu\.o$/d' drivers/kernelsu/Makefile || true
          grep -q 'CONFIG_KSU' drivers/Makefile || printf '\nobj-$(CONFIG_KSU)\t\t+= kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu' drivers/Kconfig || printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig

      # ── 配置 ──────────────────────────────────────────────────
      - name: 生成 .config
        run: |
          set -euo pipefail
          cd kernel
          V="${{ matrix.variant }}"
          case "$V" in
            control) DEF=vendor/mars_stock_defconfig ;;
            *)       DEF="${{ matrix.defconfig }}" ;;
          esac
          mkdir -p arch/arm64/configs/vendor
          cp "../configs/$(basename "$DEF")" "arch/arm64/configs/$DEF"
          [ "$V" = "allbuiltin-ksu" ] && echo 'CONFIG_KSU=y' >> "arch/arm64/configs/$DEF"
          make O=out -j"$(nproc)" CC="$CC" LD="$LD" SUBLEVEL=${SUBLEVEL_OVERRIDE} "$DEF"
          if [ "${{ matrix.lto }}" = "none" ]; then
            scripts/config --file out/.config -d LTO_CLANG -d LTO_CLANG_THIN -e LTO_NONE
          fi
          make O=out -j"$(nproc)" CC="$CC" LD="$LD" SUBLEVEL=${SUBLEVEL_OVERRIDE} olddefconfig
          echo "=== kernelrelease ==="
          make -s O=out CC="$CC" LD="$LD" SUBLEVEL=${SUBLEVEL_OVERRIDE} kernelrelease
          echo "=== 关键项 ==="
          for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS USER_NS DEVTMPFS TMPFS_POSIX_ACL \
                   TMPFS_XATTR CGROUP_DEVICE CGROUP_PIDS NETFILTER_XT_MATCH_ADDRTYPE \
                   MODVERSIONS MODULE_SIG LTO_NONE LTO_CLANG LTO_CLANG_THIN CLANG_VERSION \
                   LOCALVERSION PSTORE_RAM KSU ARM64_ERRATUM_1742098 ; do
            printf '  %-32s %s\n' "$c" "$(grep -m1 "^CONFIG_${c}=" out/.config || grep -m1 "^# CONFIG_${c} is not set" out/.config || echo '(不在本树)')"
          done
          echo "=== 与原厂配置差异 ==="
          python3 - "../configs/mars_stock_defconfig" out/.config <<'PY'
          import re,sys
          def load(p):
              d={}
              for l in open(p,errors='ignore'):
                  l=l.strip()
                  m=re.match(r'^(CONFIG_[A-Za-z0-9_]+)=(.*)$',l)
                  if m: d[m.group(1)]=m.group(2); continue
                  m=re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set$',l)
                  if m: d[m.group(1)]='n'
              return d
          a=load(sys.argv[1]); b=load(sys.argv[2])
          lost=[k for k,v in a.items() if v=='y' and b.get(k)!='y']
          print('  原厂 y 但本树丢掉/关掉: %d 项'%len(lost))
          print('  ' + ', '.join(sorted(lost)[:40]))
          print('  本树 y 而原厂非 y: %d 项'%sum(1 for k,v in b.items() if v=='y' and a.get(k)!='y'))
          PY

      # ── 编译 ──────────────────────────────────────────────────
      - name: 编译
        run: |
          set -o pipefail
          cd kernel
          /usr/bin/time -v make O=out -j"$(nproc)" CC="$CC" LD="$LD" \
            SUBLEVEL=${SUBLEVEL_OVERRIDE} 2>&1 | tee /tmp/build.log | tail -5
          ls -la out/arch/arm64/boot/Image || { echo "BUILD FAILED"; tail -80 /tmp/build.log; exit 1; }

      # ── 校验 ──────────────────────────────────────────────────
      - name: 校验产物
        run: |
          cd kernel
          IMG=out/arch/arm64/boot/Image
          mkdir -p ../artifacts
          cp "$IMG" ../artifacts/Image
          cp out/.config ../artifacts/config.gz.txt 2>/dev/null || cp out/.config ../artifacts/
          {
            echo "variant      : ${{ matrix.variant }}"
            echo "desc         : ${{ matrix.desc }}"
            echo "defconfig    : ${{ matrix.defconfig }}"
            echo "kernel_sha   : ${KERNEL_SHA}"
            echo "kernelrelease: $(make -s O=out CC=$CC LD=$LD SUBLEVEL=${SUBLEVEL_OVERRIDE} kernelrelease)"
            echo "compiler     : $($CC --version | head -1)"
            echo "image_bytes  : $(stat -c%s $IMG)"
            echo "image_md5    : $(md5sum $IMG | cut -d' ' -f1)"
            echo "lto          : ${{ matrix.lto }} / ksu: ${{ matrix.ksu }}"
          } > ../artifacts/INFO.txt
          cat ../artifacts/INFO.txt
          echo "=== 内建证据(符号出现次数) ==="
          for s in wlan_hdd_cfg80211_init cnss_wlan_register_driver hdd_wlan_startup \
                   fts_touch_spi xiaomi_touch goodix_fod ufs_qcom_ sde_kms msm_drm ; do
            printf '  %-32s %s\n' "$s" "$(strings $IMG | grep -c "$s")"
          done
          echo "=== 版本串 ==="
          strings $IMG | grep -m1 '5.4.233-qgki' || echo "WARN: 未找到 5.4.233-qgki"
          if [ "${{ matrix.ksu }}" = "1" ]; then
            echo "=== KernelSU ==="; strings $IMG | grep -c 'KernelSU' || true
          fi
          find out -name '*.ko' -exec cp {} ../artifacts/ \; 2>/dev/null || true
          ls -la ../artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: mars-${{ matrix.variant }}-${{ env.KERNEL_SHA }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: ccache 统计
        if: always()
        run: ccache --show-stats || true
