name: Build mars kernel (Droidspaces ± KernelSU)

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: 'KernelSU tag (留空 = 不集成 KernelSU)'
        required: false
        default: ''
      kabi_variant:
        description: 'SYSVIPC kABI 补丁变体'
        required: true
        type: choice
        default: '6_7_8'
        options: ['1_2_3', '3_4_5', '6_7_8']
      make_anykernel:
        description: '打包 AnyKernel3 zip'
        required: true
        type: boolean
        default: true
  push:
    branches: [main]

env:
  ARCH: arm64
  SUBARCH: arm64
  SUBLEVEL_OVERRIDE: '233'          # 对齐设备内核版本 5.4.233
  UPSTREAM: https://github.com/EcrosoftXiao/kernel_xiaomi_mars.git
  UPSTREAM_BRANCH: twelve

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # ── 磁盘空间 ────────────────────────────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      # ── 依赖 ───────────────────────────────────────────────────
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ccache bison flex libssl-dev libelf-dev bc python3 \
            python-is-python3 gperf device-tree-compiler libncurses-dev \
            rsync unzip ca-certificates lz4 xz-utils clang lld llvm cpio zip

      - name: Setup ccache
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=4G" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV

      # ── 拉取上游内核源码 ───────────────────────────────────────
      - name: Clone upstream kernel
        run: |
          git clone --depth=1 -b ${UPSTREAM_BRANCH} ${UPSTREAM} kernel
          cd kernel
          echo "KERNEL_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          # 阻止 setlocalversion 追加 git 后缀,保证 vermagic 精确可控
          : > .scmversion
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile

      # ── 应用 Droidspaces kABI 补丁 ─────────────────────────────
      - name: Apply Droidspaces kABI patches
        run: |
          cd kernel
          K=patches
          cp -r ../patches .
          patch -p1 -F5 --no-backup-if-mismatch \
            < patches/001.GKI-below-6.12-fix_sysvipc_kabi_${{ github.event.inputs.kabi_variant || '6_7_8' }}.patch || true
          patch -p1 -F5 --no-backup-if-mismatch \
            < patches/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch || true
          rm -f patches/*.rej include/linux/sched/*.rej

          # user.h 第 2 个 hunk 在 5.4.191 上会失败,做等价手工修复
          python3 - <<'PY'
          import re
          p='include/linux/sched/user.h'
          s=open(p).read()
          if 'ANDROID_KABI_USE(1, unsigned long mq_bytes)' not in s:
              old="""	/* Miscellaneous per-user rate limit */
          	struct ratelimit_state ratelimit;

          	ANDROID_KABI_RESERVE(1);
          	ANDROID_KABI_RESERVE(2);
          };"""
              new="""	/* Miscellaneous per-user rate limit */
          	struct ratelimit_state ratelimit;

          #if defined(CONFIG_POSIX_MQUEUE)
          	ANDROID_KABI_USE(1, unsigned long mq_bytes);
          	ANDROID_KABI_RESERVE(2);
          #else
          	ANDROID_KABI_RESERVE(1);
          	ANDROID_KABI_RESERVE(2);
          #endif
          };"""
              if old in s:
                  s=s.replace(old,new,1); open(p,'w').write(s); print('user.h 手工修复完成')
              else:
                  print('WARN: user.h 未匹配到手工修复模板'); raise SystemExit(1)
          else:
              print('user.h 已含 kABI 修复')
          PY

          echo "--- 校验 ---"
          grep -c 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem)' include/linux/sched.h
          grep -c 'ANDROID_KABI_USE(1, unsigned long mq_bytes)' include/linux/sched/user.h

      # ── 让 Wi-Fi / 触控 可内建(修 -Werror 与重名符号)─────────
      - name: Patch for all-builtin build
        run: |
          cd kernel
          # 1) qcacld: 内建时会触发 unused-function,而本树顶层硬编码 -Werror
          python3 - <<'PY'
          p='drivers/staging/qcacld-3.0/Kbuild'
          s=open(p).read()
          if 'ccflags-y += -Wno-error' not in s:
              old="""cppflags-y +=\t-DANI_OS_TYPE_ANDROID=6 \\
          \t\t-Wall\\
          \t\t-Werror\\
          \t\t-D__linux__"""
              new="""cppflags-y +=\t-DANI_OS_TYPE_ANDROID=6 \\
          \t\t-Wall\\
          \t\t-D__linux__

          # 内建编译时需要(本树顶层 Makefile 硬编码了 -Werror)
          ccflags-y += -Wno-error"""
              if old in s:
                  open(p,'w').write(s.replace(old,new,1)); print('qcacld -Wno-error 已加')
              else:
                  print('WARN: qcacld Kbuild 模板未匹配')
          else:
              print('qcacld 已打过补丁')
          PY
          # 2) qca-wifi-host-cmn 的 nl80211hdr_put 与 net/wireless 重名 → 改名
          for f in drivers/staging/qca-wifi-host-cmn/utils/nlink/src/wlan_nlink_srv.c \
                   drivers/staging/qca-wifi-host-cmn/utils/nlink/inc/wlan_nlink_srv.h ; do
            sed -i 's/\bvoid \*nl80211hdr_put(/void *qca_nl80211hdr_put(/g; s/\bhdr = nl80211hdr_put(/hdr = qca_nl80211hdr_put(/g' "$f"
          done
          grep -c qca_nl80211hdr_put drivers/staging/qca-wifi-host-cmn/utils/nlink/src/wlan_nlink_srv.c

      # ── 可选:集成 KernelSU ────────────────────────────────────
      - name: Integrate KernelSU
        if: github.event.inputs.ksu_tag != ''
        run: |
          cd kernel
          KSU="${{ github.event.inputs.ksu_tag }}"
          echo "集成 KernelSU $KSU"
          git clone --depth=1 --branch "$KSU" https://github.com/tiann/KernelSU.git drivers/kernelsu
          rm -rf drivers/kernelsu/.git

          # v0.7.x 把源码放在 kernel/ 子目录,平铺到顶层
          if [ -d drivers/kernelsu/kernel ]; then
            shopt -s dotglob
            mv drivers/kernelsu/kernel/* drivers/kernelsu/
            rmdir drivers/kernelsu/kernel
          fi
          # 修 Makefile 里没有消费者的 kernelsu-objs
          sed -i 's/^kernelsu-objs := apk_sign\.o$/obj-y += apk_sign.o/' drivers/kernelsu/Makefile || true
          sed -i '/^obj-y += kernelsu\.o$/d' drivers/kernelsu/Makefile || true

          # 接入内核构建
          grep -q 'CONFIG_KSU' drivers/Makefile || printf '\nobj-$(CONFIG_KSU)\t\t+= kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu' drivers/Kconfig || printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig

      # ── 生成 .config ───────────────────────────────────────────
      - name: Configure
        run: |
          cd kernel
          cp ../configs/mars_droidspaces_defconfig arch/arm64/configs/vendor/mars_droidspaces_defconfig
          if [ "${{ github.event.inputs.ksu_tag }}" != "" ]; then
            echo 'CONFIG_KSU=y' >> arch/arm64/configs/vendor/mars_droidspaces_defconfig
          fi
          make O=out -j$(nproc) CC=clang CXX=clang++ LD=ld.lld \
            SUBLEVEL=${SUBLEVEL_OVERRIDE} vendor/mars_droidspaces_defconfig
          make O=out -j$(nproc) CC=clang CXX=clang++ LD=ld.lld \
            SUBLEVEL=${SUBLEVEL_OVERRIDE} olddefconfig
          echo "=== kernelrelease(应为 5.4.233-qgki-gbb70cde46897) ==="
          make -s O=out CC=clang CXX=clang++ LD=ld.lld SUBLEVEL=${SUBLEVEL_OVERRIDE} kernelrelease
          echo "=== 关键配置 ==="
          for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS CGROUP_DEVICE DEVTMPFS USER_NS \
                   QCA_CLD_WLAN ICNSS2 TOUCHSCREEN_ST_FTS_V521_SPI_K2 FINGERPRINT_GOODIX_FOD KSU ; do
            printf '  %-38s %s\n' "$c" "$(grep -m1 "^CONFIG_${c}=" out/.config || echo '(未设置)')"
          done

      # ── 编译 ───────────────────────────────────────────────────
      - name: Build kernel
        run: |
          cd kernel
          make O=out -j$(nproc) CC=clang CXX=clang++ LD=ld.lld \
            SUBLEVEL=${SUBLEVEL_OVERRIDE} 2>&1 | tee /tmp/build.log
          ls -la out/arch/arm64/boot/Image || { echo "BUILD FAILED"; tail -60 /tmp/build.log; exit 1; }

      # ── 校验产物 ───────────────────────────────────────────────
      - name: Verify image
        run: |
          cd kernel
          IMG=out/arch/arm64/boot/Image
          echo "=== 内建证据 ==="
          for s in wlan_hdd_cfg80211_init cnss_wlan_register_driver hdd_wlan_startup \
                   fts_touch_spi xiaomi_touch goodix_fod ufs_qcom_ sde_kms ; do
            printf '  %-32s %s\n' "$s" "$(strings $IMG | grep -c "$s")"
          done
          echo "=== 版本字符串 ==="
          strings $IMG | grep -m1 '5.4.233-qgki-gbb70cde46897' || echo "WARN: 未找到目标版本串"
          if [ "${{ github.event.inputs.ksu_tag }}" != "" ]; then
            echo "=== KernelSU 证据 ==="
            strings $IMG | grep -c 'KernelSU' || true
          fi
          mkdir -p ../artifacts
          cp $IMG ../artifacts/Image
          # 收集仍为模块的部分(音频/相机/移动数据),供 APatch 叠加模块使用
          find out -name '*.ko' -exec cp {} ../artifacts/ \; 2>/dev/null || true
          ls -la ../artifacts | head -20

      # ── AnyKernel3 打包 ────────────────────────────────────────
      - name: Package AnyKernel3
        if: github.event.inputs.make_anykernel == 'true'
        run: |
          cd /tmp
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf modules patch ramdisk
          mkdir -p modules
          cp $GITHUB_WORKSPACE/artifacts/Image .
          cat > anykernel.sh <<'AK3'
          ### AnyKernel3 — mars droidspaces
          properties() { '
          kernel.string=mars-droidspaces
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=mars
          supported.versions=12,13
          '; }
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3
          DATE=$(date +%Y%m%d)
          KSU="${{ github.event.inputs.ksu_tag }}"
          NAME="mars-droidspaces${KSU:+-ksu}-${DATE}-${{ env.KERNEL_SHA }}.zip"
          zip -q -r9 "$NAME" anykernel.sh Image tools/ -x '*.zip'
          cp "$NAME" $GITHUB_WORKSPACE/artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: mars-kernel-${{ env.KERNEL_SHA }}${{ github.event.inputs.ksu_tag && format('-ksu-{0}', github.event.inputs.ksu_tag) || '' }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
