name: LOS 5.4.242 mars kernel (Droidspaces, MIUI vendor DLKM compatible)

# 目标: 用 LineageOS sm8350 lineage-20 (Xiaomi QGKI 5.4.242) 作新基线，配置用【原厂 /proc/config.gz】
#       + 容器必需项 + MODVERSIONS=n + vermagic 硬编码成原厂串 ⇒ 让 MIUI /vendor 的 DLKM 能装进来，
#       从而保留原厂 WiFi/触屏/显示栈，同时拿到容器能力。
on:
  workflow_dispatch:
    inputs:
      los_ref:
        description: 'LOS kernel ref'
        required: false
        default: 'lineage-20'
      config:
        description: 'repo configs/ 下的基础 config'
        required: false
        default: 'mars_factory.config'
      jobs:
        description: '并行度'
        required: false
        default: '4'
      kcflags:
        description: 'KCFLAGS'
        required: false
        default: '-Wno-error'
      extra_config:
        description: '额外 config 操作(逗号分隔,每项是一组 scripts/config 参数)'
        required: false
        default: '-d PANIC_ON_OOPS,-d QCOM_FORCE_WDOG_BITE_ON_PANIC,-d PANIC_ON_SSR_NOTIF_TIMEOUT,-d DEBUG_POWER_MI,-e DETECT_HUNG_TASK,--set-val DEFAULT_HUNG_TASK_TIMEOUT 15'
      logdump:
        description: '接入 logdump 连续落盘驱动(1=是)'
        required: false
        default: '1'
      gates:
        description: '1=打 mod-blacklist + wlan-gate(默认挡住 WLAN 栈, 保证能进 MIUI)'
        required: false
        default: '0'
      force_m:
        description: '逗号分隔的 CONFIG 名, 强制 =m(例: QCA_CLD_WLAN)'
        required: false
        default: ''
      modules:
        description: '1=同时编译内核模块并打包(用于把 LOS 自带 WLAN/其他驱动模块推到手机加载)'
        required: false
        default: '0'
      force_y:
        description: '逗号分隔的 CONFIG 名, 强制 =y(例: QCA_CLD_WLAN,CNSS2,CNSS_QCA6490)'
        required: false
        default: ''
      wlanblock:
        description: '1=打 wlan-block(只挡 WLAN 链, 其余模块照原厂放行)'
        required: false
        default: '0'
      cld_features:
        description: '1=使用 qcacld 自带供应商特性集(configs/*.conf, 含 HIF_PCI/PLD_PCIE_CNSS_FLAG 等)'
        required: false
        default: '0'
      cld_ref:
        description: '非空=接入 CLO 自编 WLAN 驱动(qcacld-3.0/qca-wifi-host-cmn/fw-api 的分支名, 例 LA.UM.9.14.1.c30)'
        required: false
        default: ''
      los_commit:
        description: '指定 LOS 内核提交(留空=lineage-20 最新). 例: 6bb176e034 = 5.4.233(与原厂模块同源)'
        required: false
        default: ''
      hwid_deexport:
        description: '1=去掉内建 hwid 的 EXPORT_SYMBOL, 让原厂 hwid.ko 能装(cnss2 的依赖)'
        required: false
        default: '0'
      wlan_allow:
        description: '空格分隔的例外名单(定向门禁): 只放行这些 WLAN 模块, 其余 WLAN 链仍挡. 例: qca_cld3_wlan qca_cld3_qca6390'
        required: false
        default: ''
      ignore_vermagic:
        description: '1=让内核忽略 vermagic 不一致(与原厂一致; 272 个模块里 224 个是"无 qgki"串)'
        required: false
        default: '0'
      mi_syms:
        description: '1=接入 mi_syms_los.c(补 mi_display_pm_suspend_callback_set 等 10 个符号)'
        required: false
        default: '0'
      allbuiltin:
        description: '1=把 factory config 里所有 =m 驱动翻成 =y(内建; 原厂那些 GKI 模块就变成冗余)'
        required: false
        default: '0'
      kabi:
        description: '1=打 Droidspaces kABI 补丁(SYSVIPC/POSIX_MQUEUE 用 KABI 预留槽, 不改结构体布局)'
        required: false
        default: '0'
      modversions:
        description: '分析用: 1=保留 MODVERSIONS=y(生成真实 CRC, 用于与原厂模块比对; 该 Image 不可刷)'
        required: false
        default: '0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zip unzip curl wget cpio rsync \
            python3 gperf device-tree-compiler libncurses-dev lz4 xz-utils time \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 安装 clang 11.0.2 (r383902b1, 与原厂 DLKM 同工具链)
        run: |
          set -uo pipefail
          DEST="$HOME/aosp-clang"; rm -rf "$DEST"; mkdir -p "$DEST"; ok=0
          for r in credits-infra/clang-r383902b1 ruoqing501/clang-r383902b1 qssn70/clang-r383902b1; do
            U="https://codeload.github.com/${r}/tar.gz/refs/heads/main"
            echo "=== mirror $U"
            if curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/clang.tgz "$U"; then
              rm -rf /tmp/clangx && mkdir -p /tmp/clangx && tar -xzf /tmp/clang.tgz -C /tmp/clangx
              SRC=$(find /tmp/clangx -maxdepth 1 -mindepth 1 -type d | head -1)
              if [ -x "$SRC/bin/clang" ]; then cp -a "$SRC"/. "$DEST"/; ok=1; break; fi
            fi
          done
          if [ "$ok" != 1 ]; then
            for d in clang-r383902b1 clang-r383902b; do
              U="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/${d}.tar.gz"
              echo "=== $U"
              if curl -fsSL --retry 2 --connect-timeout 20 -o /tmp/clang.tgz "$U"; then
                rm -rf "$DEST"/*; tar -xzf /tmp/clang.tgz -C "$DEST" && ok=1 && break
              fi
            done
          fi
          [ "$ok" = 1 ] || { echo "::error::clang 11 取不到"; exit 1; }
          if [ ! -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi
          echo "$DEST/bin" >> $GITHUB_PATH
          "$DEST/bin/clang" --version | head -2

      - name: 克隆 LOS 内核
        run: |
          set -e
          if [ -n "${{ github.event.inputs.los_commit }}" ]; then
            echo "=== 用归档方式取指定提交: ${{ github.event.inputs.los_commit }} ==="
            curl -sSL --retry 3 -o /tmp/los.tar.gz \
              "https://github.com/LineageOS/android_kernel_xiaomi_sm8350/archive/${{ github.event.inputs.los_commit }}.tar.gz"
            ls -l /tmp/los.tar.gz
            mkdir -p kernel && tar xzf /tmp/los.tar.gz --strip-components=1 -C kernel
          else
            git clone --depth 1 -b "${{ github.event.inputs.los_ref }}" \
              https://github.com/LineageOS/android_kernel_xiaomi_sm8350 kernel
          fi
          cd kernel
          echo "HEAD: $(git log -1 --format='%h %ci' 2>/dev/null || echo '(archive of ${{ github.event.inputs.los_commit }})')"
          head -4 Makefile
          ls arch/arm64/configs/vendor/ 2>/dev/null | head -20 || true
          ls arch/arm64/configs/ 2>/dev/null | head -20 || true

      - name: 配置（原厂 config + 容器项 + 模块兼容）
        run: |
          set -euo pipefail
          cd kernel
          mkdir -p out
          MK="make -s O=out ARCH=arm64 CC=clang LD=ld.lld"
          SC="./scripts/config"
          if [ "${{ github.event.inputs.config }}" = "loschain" ]; then
            echo "=== 用 LOS 原生配置链(lahaina-qgki + debugfs + xiaomi_QGKI + star_QGKI) ==="
            $MK vendor/lahaina-qgki_defconfig vendor/debugfs.config vendor/xiaomi_QGKI.config vendor/star_QGKI.config
          else
            cp "$GITHUB_WORKSPACE/configs/${{ github.event.inputs.config }}" out/.config
          fi
          $MK olddefconfig
          bash "$GITHUB_WORKSPACE/patches/container-opts.sh" "$PWD"
          $MK olddefconfig
          bash "$GITHUB_WORKSPACE/patches/container-opts.sh" "$PWD"
          # 额外 config 操作(逗号分隔)
          IFS=',' read -ra OPS <<< "${{ github.event.inputs.extra_config }}"
          for op in "${OPS[@]}"; do
            [ -n "$op" ] || continue
            echo "  scripts/config $op"
            $SC --file out/.config $op || echo "  (跳过失败项: $op)"
          done
          if [ "${{ github.event.inputs.allbuiltin }}" = "1" ]; then
            echo "=== allbuiltin: 所有 =m 翻成 =y ==="
            n=0
            for sym in $(grep -oE '^CONFIG_[A-Za-z0-9_]+=m' out/.config | cut -d= -f1); do
              $SC --file out/.config -e "${sym#CONFIG_}" 2>/dev/null && n=$((n+1))
            done
            echo "  翻了 $n 个符号"
            $MK olddefconfig
            echo "  剩余 =m 个数: $(grep -cE '=m$' out/.config)"
          fi
          if [ -n "${{ github.event.inputs.force_m }}" ]; then
            IFS=',' read -ra FMS <<< "${{ github.event.inputs.force_m }}"
            for m in "${FMS[@]}"; do
              [ -n "$m" ] || continue
              echo "  force -m $m"
              $SC --file out/.config -m "$m" || echo "  (跳过 $m)"
            done
            $MK olddefconfig
            for m in "${FMS[@]}"; do grep -q "^CONFIG_$m=m" out/.config || echo "::warning::force_m 未生效: $m"; done
          fi
          if [ -n "${{ github.event.inputs.force_y }}" ]; then
            IFS=',' read -ra FYS <<< "${{ github.event.inputs.force_y }}"
            for y in "${FYS[@]}"; do
              [ -n "$y" ] || continue
              echo "  force -e $y"
              $SC --file out/.config -e "$y" || echo "  (跳过 $y)"
            done
            $MK olddefconfig
            for y in "${FYS[@]}"; do grep -q "^CONFIG_$y=y" out/.config || echo "::warning::force_y 未生效: $y"; done
          fi
          if [ "${{ github.event.inputs.modversions }}" = "1" ]; then
            echo "=== 分析模式: 恢复 MODVERSIONS=y 以生成真实 CRC ==="
            $SC --file out/.config -e MODVERSIONS -e ASM_MODVERSIONS
            $MK olddefconfig
          fi
          # 断言
          fail=0
          for k in PID_NS IPC_NS UTS_NS NET_NS USER_NS SYSVIPC POSIX_MQUEUE DEVTMPFS CGROUPS \
                   CGROUP_DEVICE NAMESPACES VETH SECCOMP_FILTER OVERLAY_FS BRIDGE TMPFS NF_NAT \
                   IP_NF_TARGET_MASQUERADE; do
            grep -q "^CONFIG_$k=y" out/.config || { echo "::warning::容器项 $k 不是 y"; fail=1; }
          done
          for k in CFI_CLANG LTO_CLANG THINLTO; do
            # 老树(5.4.233)可能不支持 CFI/LTO: 只告警不失败(只影响代码生成, 不影响 ABI)
            grep -q "^CONFIG_$k=y" out/.config || echo "::warning::$k 未启用(该树可能不支持), 继续"
          done
          if [ "${{ github.event.inputs.modversions }}" != "1" ]; then
            grep -q '^# CONFIG_MODVERSIONS is not set' out/.config || { echo "::error::MODVERSIONS 没关掉"; fail=1; }
          fi
          grep -q '^CONFIG_LOCALVERSION="-qgki-gbb70cde46897"' out/.config || { echo "::error::LOCALVERSION 不对"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          python3 "$GITHUB_WORKSPACE/patches/vermagic.py" include/linux/vermagic.h 2>/dev/null || \
            python3 "$GITHUB_WORKSPACE/patches/vermagic.py"
          if [ "${{ github.event.inputs.ignore_vermagic }}" != "1" ]; then
            grep -q '5.4.233-qgki-gbb70cde46897 SMP preempt mod_unload modversions aarch64' include/linux/vermagic.h \
              || { echo "::warning::vermagic 补丁没生效(分析模式可忽略)"; }
          fi
          echo "=== 关键 config ==="
          grep -E "^CONFIG_(PID_NS|IPC_NS|USER_NS|SYSVIPC|POSIX_MQUEUE|DEVTMPFS|CGROUPS|CGROUP_DEVICE|MODVERSIONS|LOCALVERSION|CFI_CLANG|LTO_CLANG|THINLTO)" out/.config || true

      - name: (可选) 接入 CLO qcacld-3.0 源码 — 自编 WLAN 驱动
        if: github.event.inputs.cld_ref != ''
        run: |
          set -e
          K="$GITHUB_WORKSPACE/kernel"
          REF="${{ github.event.inputs.cld_ref }}"
          for R in fw-api qca-wifi-host-cmn qcacld-3.0; do
            rm -rf "$K/drivers/staging/$R"
            echo "=== clone $R ($REF) ==="
            git clone -q --depth 1 -b "$REF" "https://git.codelinaro.org/clo/la/platform/vendor/qcom-opensource/wlan/$R" "$K/drivers/staging/$R"
            du -sh "$K/drivers/staging/$R" | tail -1
          done
          # 只有 qcacld-3.0 有 Kconfig; fw-api/cmn 是被 Kbuild 相对路径引用的源码库
          LAST=$(tail -1 "$K/drivers/staging/Kconfig")
          head -n -1 "$K/drivers/staging/Kconfig" > /tmp/k.tmp
          echo 'source "drivers/staging/qcacld-3.0/Kconfig"' >> /tmp/k.tmp
          echo "$LAST" >> /tmp/k.tmp
          mv /tmp/k.tmp "$K/drivers/staging/Kconfig"
          grep -q 'qcacld-3.0/' "$K/drivers/staging/Makefile" || echo 'obj-$(CONFIG_QCA_CLD_WLAN) += qcacld-3.0/' >> "$K/drivers/staging/Makefile"
          echo "=== 强制打开 CONFIG_QCA_CLD_WLAN=m ==="
          sed -i '/^# CONFIG_QCA_CLD_WLAN is not set/d;/^CONFIG_QCA_CLD_WLAN=/d' "$K/out/.config"
          echo 'CONFIG_QCA_CLD_WLAN=m' >> "$K/out/.config"
          if [ "${{ github.event.inputs.cld_features }}" = "1" ]; then
            python3 "$GITHUB_WORKSPACE/patches/cld-features.py" "$K" "$GITHUB_WORKSPACE"
            cat "$GITHUB_WORKSPACE/.config.fragment" >> "$K/out/.config"
          fi
          ( cd "$K" && make -s O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang olddefconfig )
          grep -q '^CONFIG_QCA_CLD_WLAN=m' "$K/out/.config" || { echo "::error::QCA_CLD_WLAN 没打开"; exit 1; }
          echo "OK: QCA_CLD_WLAN=m; 特性片段 $(wc -l < "$GITHUB_WORKSPACE/.config.fragment" 2>/dev/null || echo 0) 行; 剩余 =m 数 $(grep -cE '=m$' "$K/out/.config")"

      - name: 修 LOS 树 UAPI 头(msm-cirrus-playback.h 用了 uint32_t, header check 会失败)
        run: |
          H=kernel/techpack/audio/include/uapi/audio/sound/msm-cirrus-playback.h
          if [ -f "$H" ]; then
            sed -i 's/\buint32_t\b/__u32/g' "$H"
            echo "=== 修完后的 struct ==="; grep -n -A6 'struct crus_sp_ioctl_header' "$H" || true
          else
            echo "(该树没有这个头,跳过)"
          fi

      - name: 打模块门禁 — mod-blacklist + wlan-gate(只放行显示/触屏/电池, WLAN 栈默认挡住)
        if: github.event.inputs.gates == '1'
        run: |
          set -e
          python3 "$GITHUB_WORKSPACE/patches/mod-blacklist.py" "$PWD/kernel"
          python3 "$GITHUB_WORKSPACE/patches/wlan-gate.py" "$PWD/kernel"
          grep -c 'mars_module_blocked' kernel/kernel/module.c
          grep -q 'mars_wlan_allow' kernel/kernel/module.c && echo "gate 参数已注入"

      - name: 打 Droidspaces kABI 补丁(SYSVIPC/POSIX_MQUEUE 不改 ABI 布局)
        if: github.event.inputs.kabi == '1'
        run: |
          set -e
          python3 "$GITHUB_WORKSPACE/patches/kabi-sysvipc.py" "$PWD/kernel"
          python3 "$GITHUB_WORKSPACE/patches/kabi-posix-mqueue.py" "$PWD/kernel"

      - name: 忽略 vermagic + 接入 MIUI 符号桩(mi_syms_los)
        if: github.event.inputs.ignore_vermagic == '1' || github.event.inputs.mi_syms == '1'
        run: |
          set -e
          if [ "${{ github.event.inputs.ignore_vermagic }}" = "1" ]; then
            python3 "$GITHUB_WORKSPACE/patches/ignore-vermagic.py" "$PWD/kernel"
          fi
          if [ "${{ github.event.inputs.mi_syms }}" = "1" ]; then
            cp "$GITHUB_WORKSPACE/patches/mi_syms_los.c" kernel/drivers/soc/qcom/mi_syms_los.c
            grep -q 'mi_syms_los.o' kernel/drivers/soc/qcom/Makefile || echo 'obj-y += mi_syms_los.o' >> kernel/drivers/soc/qcom/Makefile
            tail -2 kernel/drivers/soc/qcom/Makefile
          fi

      - name: 打 WLAN 专用黑名单 — wlan-block(其余模块照原厂放行)
        if: github.event.inputs.wlanblock == '1' || github.event.inputs.wlan_allow != ''
        run: |
          set -e
          python3 "$GITHUB_WORKSPACE/patches/wlan-block.py" "$PWD/kernel" ${{ github.event.inputs.wlan_allow }}
          grep -c 'mars_wlan_is_blocked' kernel/kernel/module.c
          grep -q 'mars_wlan_allow' kernel/kernel/module.c && echo "gate 参数已注入"
          if [ -n "${{ github.event.inputs.wlan_allow }}" ]; then
            grep -c 'mars_wlan_in_allow_names' kernel/kernel/module.c
            echo "定向放行名单: ${{ github.event.inputs.wlan_allow }}"
          fi

      - name: hwid 去导出 — 让原厂 hwid.ko 能装(原厂 cnss2 依赖它)
        if: github.event.inputs.hwid_deexport == '1'
        run: |
          set -e
          python3 "$GITHUB_WORKSPACE/patches/hwid-deexport.py" "$PWD/kernel"
          echo "剩余 EXPORT_SYMBOL: $(grep -c '^EXPORT_SYMBOL' kernel/drivers/misc/hwid.c || true)"

      - name: 接入 logdump + moddbg(内核日志连续落盘 + 模块表诊断)
        if: github.event.inputs.logdump == '1'
        run: |
          set -e
          cp "$GITHUB_WORKSPACE/patches/logdump.c" kernel/drivers/soc/qcom/logdump.c
          grep -q 'logdump.o' kernel/drivers/soc/qcom/Makefile || echo 'obj-y += logdump.o' >> kernel/drivers/soc/qcom/Makefile
          if grep -q moddbg_dump kernel/module.c; then echo "moddbg 钩子已存在"; else cat "$GITHUB_WORKSPACE/patches/moddbg.c" >> kernel/module.c; fi
          grep -n 'moddbg_dump\|moddbg_mutex_owner' kernel/module.c | head -4
          # 弱兜底: 即使 moddbg 钩子没接上,logdump 也能链接
          {
            echo ''
            echo '/* 弱兜底(CI 追加): moddbg 钩子缺失时也能链接 */'
            echo 'struct task_struct * __weak moddbg_mutex_owner(void) { return NULL; }'
            echo 'void __weak moddbg_dump(void) { }'
          } >> kernel/drivers/soc/qcom/logdump.c
          tail -4 kernel/drivers/soc/qcom/logdump.c

      - name: 编译 Image
        run: |
          set -uo pipefail
          cd kernel
          set -x
          make -k -j"${{ github.event.inputs.jobs }}" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld KCFLAGS="${{ github.event.inputs.kcflags }}" KBUILD_MODPOST_WARN=1 \
            Image > "$GITHUB_WORKSPACE/build.log" 2>&1
          rc=$?
          set +x
          echo "make rc=$rc  errors=$(grep -c 'error:' "$GITHUB_WORKSPACE/build.log" || true)"
          tail -60 "$GITHUB_WORKSPACE/build.log"
          ls -l out/arch/arm64/boot/Image 2>/dev/null || true
          [ -s out/arch/arm64/boot/Image ] || { echo "::error::没有 Image"; exit 1; }
          [ "$rc" = 0 ] || echo "::warning::make rc=$rc 但 Image 已生成, 继续(不阻断模块步骤)"

      - name: 编译内核模块并打包(可选)
        if: github.event.inputs.modules == '1'
        run: |
          set -uo pipefail
          cd kernel
          MV=""
          if [ -s "$GITHUB_WORKSPACE/cld_makevars.txt" ]; then MV=$(tr '\n' ' ' < "$GITHUB_WORKSPACE/cld_makevars.txt"); echo "带 $(wc -l < "$GITHUB_WORKSPACE/cld_makevars.txt") 个 CLD make 变量"; fi
          make -k -j"${{ github.event.inputs.jobs }}" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld KCFLAGS="${{ github.event.inputs.kcflags }}" KBUILD_MODPOST_WARN=1 $MV \
            modules > "$GITHUB_WORKSPACE/modules.log" 2>&1
          rc=$?
          echo "modules rc=$rc errors=$(grep -c 'error:' "$GITHUB_WORKSPACE/modules.log" || true)"
          tail -20 "$GITHUB_WORKSPACE/modules.log"
          if [ "$rc" != 0 ]; then echo "::warning::modules rc=$rc(有失败), 仍尝试打包已产出的模块"; fi
          if true; then
            rm -rf "$GITHUB_WORKSPACE/modout"
            make -s O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld \
              INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modout" INSTALL_MOD_STRIP=1 modules_install || true
            ( cd "$GITHUB_WORKSPACE/modout" && tar czf "$GITHUB_WORKSPACE/modules.tgz" lib/modules ) || true
            ls -l "$GITHUB_WORKSPACE/modules.tgz" || true
            find "$GITHUB_WORKSPACE/modout" -name '*.ko' | wc -l
            find "$GITHUB_WORKSPACE/modout" -name '*.ko' | xargs -r basename -a | grep -E 'cnss|qca_cld|icnss|cfg80211|mac80211' | head -10
          fi

      - name: 汇总
        if: always()
        run: |
          {
            echo "los_ref=${{ github.event.inputs.los_ref }}"
            echo "config=${{ github.event.inputs.config }}"
            echo "head=$(git -C kernel log -1 --format='%h %ci' 2>/dev/null)"
            echo "image_size=$(stat -c%s kernel/out/arch/arm64/boot/Image 2>/dev/null)"
            echo "image_md5=$(md5sum kernel/out/arch/arm64/boot/Image 2>/dev/null | cut -d' ' -f1)"
            echo "errors=$(grep -c 'error:' build.log 2>/dev/null || echo 0)"
            echo "--- unique error sites ---"
            grep -h 'error:' build.log 2>/dev/null | sed -E 's/^.*kernel\///' | cut -c1-160 | sort -u | head -40
          } > meta.txt
          cat meta.txt
          tail -c 400000 build.log > build-tail.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: los-kernel-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/Module.symvers
            kernel/out/System.map
            meta.txt
            build-tail.txt
            modules.tgz
          if-no-files-found: warn
          retention-days: 14
